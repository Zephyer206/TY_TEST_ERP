version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Database - 使用腾讯云服务器上的 PostgreSQL
      DB_HOST: 124.222.29.229
      DB_PORT: 5432
      DB_NAME: stamping_system
      DB_USER: postgres
      DB_PASSWORD: thehaoshi5DE
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Server
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      # CORS
      CORS_ORIGINS: "*"
      # 腾讯云 COS
      COS_ENABLED: "true"
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_BUCKET: zephyr-erp
      COS_REGION: ap-guangzhou
      COS_ENDPOINT: https://cos.ap-guangzhou.myqcloud.com
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./static:/app/static

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

networks:
  default:
    name: zephyr-net
