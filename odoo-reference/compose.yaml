name: odoo-reference

services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - odoo_reference_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  odoo:
    # Official Odoo image supplied through an accessible Docker registry mirror.
    image: docker.m.daocloud.io/library/odoo:18.0
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: database
      USER: odoo
      PASSWORD: ""
    command: --database=odoo_reference
    volumes:
      - odoo_reference_web:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro

volumes:
  odoo_reference_database:
  odoo_reference_web:
