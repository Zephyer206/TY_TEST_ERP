<!--
  shared_numpad.html
  ─────────────────────────────────────────────────────────────────────────────
  TY_Tset_ERP ERP · 全屏大字数字键盘（Minimalist Employee UI）
  V3.1 §3.2 大字原则：适配油污环境，数字键盘全屏化，成功反馈绿色遮罩

  使用方式：在页面底部 include 此文件，并在需要的 input 元素上添加
    onclick="numpad.open(this, '字段标签名')"
  即可自动唤起键盘。

  键盘输出会自动填入 input.value，并触发 input 的 oninput 事件（若有）。
  按"确认"时触发回调（可选）：
    numpad.onConfirm = function(inputEl, value) { ... }

  主题色：通过 CSS 变量注入，默认为 operator_ui 的深色主题。
  若页面使用浅色主题（如 pkg_scan），在引入前设置：
    --np-bg: #f0f4f8;
    --np-surface: #ffffff;
    --np-text: #0f172a;
    --np-accent: #0891b2;   （青色 / cyan）
    --np-confirm-bg: linear-gradient(135deg, #0891b2, #0369a1);
    --np-confirm-color: #ffffff;
    --np-border: rgba(0,0,0,0.1);
    --np-shadow: 0 8px 32px rgba(0,0,0,0.15);
-->
<style>
/* ── CSS 变量（可被页面覆盖）─────────────────────────────────── */
:root {
    --np-bg:             #0d1117;
    --np-surface:        #161b22;
    --np-key-bg:         rgba(255,255,255,0.07);
    --np-key-active:     rgba(255,255,255,0.18);
    --np-key-text:       #f0f6fc;
    --np-key-radius:     16px;
    --np-key-font:       26px;
    --np-key-height:     72px;
    --np-border:         rgba(255,255,255,0.08);
    --np-shadow:         0 -4px 40px rgba(0,0,0,0.7);
    --np-display-color:  #f0f6fc;
    --np-accent:         #238636;
    --np-accent2:        #2ea043;
    --np-confirm-bg:     linear-gradient(135deg, var(--np-accent), var(--np-accent2));
    --np-confirm-color:  #ffffff;
    --np-danger-bg:      rgba(248,81,73,0.18);
    --np-danger-active:  rgba(248,81,73,0.30);
    --np-danger-text:    #f85149;
}

/* ── 遮罩层 ─────────────────────────────────────────────────── */
#numpad-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--np-bg);
    z-index: 9999;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}
#numpad-overlay.np-open {
    display: flex;
    animation: npSlideUp 0.18s cubic-bezier(0.32, 0.72, 0, 1);
}
@keyframes npSlideUp {
    from { transform: translateY(100%); opacity: 0.6; }
    to   { transform: translateY(0);    opacity: 1;   }
}

/* ── 顶部栏 ─────────────────────────────────────────────────── */
.np-header {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--np-border);
}
.np-header-label {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.5px;
}
.np-close-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--np-key-bg);
    border: none;
    color: var(--np-key-text);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s;
}
.np-close-btn:active { background: var(--np-key-active); }

/* ── 显示区 ─────────────────────────────────────────────────── */
.np-display {
    flex-shrink: 0;
    padding: 20px 24px 16px;
    text-align: center;
}
.np-display-value {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--np-accent);
    outline: none;
    color: var(--np-display-color);
    font-size: 52px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: 0 0 10px;
    caret-color: var(--np-accent2);
    letter-spacing: 2px;
}

/* ── 键盘网格 ─────────────────────────────────────────────────── */
.np-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
    align-content: end;
}

/* ── 普通按键 ─────────────────────────────────────────────────── */
.np-key {
    height: var(--np-key-height);
    border-radius: var(--np-key-radius);
    background: var(--np-key-bg);
    border: none;
    color: var(--np-key-text);
    font-size: var(--np-key-font);
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.08s, transform 0.06s, box-shadow 0.08s;
    /* 触感反馈 */
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 2px 0 rgba(0,0,0,0.3) inset;
    position: relative;
    overflow: hidden;
}
.np-key::after {
    content: '';
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    transition: opacity 0.06s;
}
.np-key.np-key-pressed::after { opacity: 0.12; }
.np-key:active,
.np-key.np-key-pressed {
    background: var(--np-key-active);
    transform: translateY(1px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.3) inset;
}

/* ── C 清除键（红色警示）── */
.np-key.np-key-clear {
    background: var(--np-danger-bg);
    color: var(--np-danger-text);
    font-size: 20px;
}
.np-key.np-key-clear:active { background: var(--np-danger-active); }

/* ── 退格键 ──────────────────────────────── */
.np-key.np-key-back {
    background: rgba(255,255,255,0.04);
    font-size: 22px;
}

/* ── 确认键（双色渐变，跨两格）──────────── */
.np-key.np-key-confirm {
    background: var(--np-confirm-bg);
    color: var(--np-confirm-color);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 1px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25) inset, 0 4px 20px rgba(35,134,54,0.4);
    grid-column: 2 / 4;   /* 占据右两格，底部居右 */
}
.np-key.np-key-confirm:active {
    box-shadow: 0 2px 0 rgba(0,0,0,0.25) inset, 0 2px 12px rgba(35,134,54,0.3);
}

/* ── 实际占满确认键整行 ─────────────────── */
.np-confirm-row {
    display: grid;
    grid-column: 1 / -1;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 0 16px 0;
}
.np-confirm-row .np-key-confirm { grid-column: unset; }

/* ── 成功绿色遮罩反馈 ─────────────────────────────────────────── */
#numpad-success {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10001;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    pointer-events: none;
}
#numpad-success.np-success-show {
    display: flex;
    animation: npFadeInOut 1.0s ease forwards;
}
@keyframes npFadeInOut {
    0%   { opacity: 0; }
    15%  { opacity: 1; }
    75%  { opacity: 1; }
    100% { opacity: 0; }
}
.np-success-icon {
    width: 110px; height: 110px;
    border-radius: 50%;
    background: var(--np-accent);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 80px rgba(35,134,54,0.75);
    animation: npPopIn 0.2s ease;
}
@keyframes npPopIn {
    0%   { transform: scale(0.4); opacity: 0; }
    65%  { transform: scale(1.08); }
    100% { transform: scale(1);   opacity: 1; }
}
.np-success-icon-inner {
    font-size: 58px;
    color: white;
    line-height: 1;
}
.np-success-text {
    font-size: 22px;
    font-weight: 800;
    color: #3fb950;
    text-shadow: 0 2px 8px rgba(35,134,54,0.6);
    letter-spacing: 1px;
}
</style>

<!-- ── 键盘 DOM ───────────────────────────────────────────────── -->
<div id="numpad-overlay">
    <div class="np-header">
        <span class="np-header-label" id="npLabel">输入</span>
        <button class="np-close-btn" onclick="numpad.close()">&#x2715;</button>
    </div>
    <div class="np-display">
        <input type="text" id="npDisplay" class="np-display-value"
               inputmode="numeric" readonly autocomplete="off">
    </div>
    <div class="np-grid">
        <button class="np-key"      onclick="numpad.digit('1')">1</button>
        <button class="np-key"      onclick="numpad.digit('2')">2</button>
        <button class="np-key"      onclick="numpad.digit('3')">3</button>
        <button class="np-key"      onclick="numpad.digit('4')">4</button>
        <button class="np-key"      onclick="numpad.digit('5')">5</button>
        <button class="np-key"      onclick="numpad.digit('6')">6</button>
        <button class="np-key"      onclick="numpad.digit('7')">7</button>
        <button class="np-key"      onclick="numpad.digit('8')">8</button>
        <button class="np-key"      onclick="numpad.digit('9')">9</button>
        <button class="np-key np-key-clear" onclick="numpad.clear()">C</button>
        <button class="np-key"      onclick="numpad.digit('0')">0</button>
        <button class="np-key np-key-back"  onclick="numpad.back()">&#x232B;</button>
    </div>
    <div class="np-confirm-row" style="padding-bottom: calc(16px + env(safe-area-inset-bottom));">
        <button class="np-key np-key-confirm" onclick="numpad.confirm()">&#x2713; 确认</button>
    </div>
</div>

<!-- ── 成功反馈遮罩 ─────────────────────────────────────────── -->
<div id="numpad-success">
    <div class="np-success-icon">
        <div class="np-success-icon-inner">&#x2713;</div>
    </div>
    <div class="np-success-text">已确认</div>
</div>

<script>
/* ── 共享数字键盘管理器 ──────────────────────────────────────── */
window.numpad = (function() {
    var _target   = null;   // 当前绑定的 input 元素
    var _raw      = '';     // 原始字符串
    var _label    = '';     // 字段标签

    /* 按键触感反馈：按下时添加 .np-key-pressed 类 */
    document.querySelectorAll('.np-key').forEach(function(btn) {
        btn.addEventListener('touchstart', function(e) {
            /* 短按触发触感类 */
            var el = e.currentTarget;
            el.classList.add('np-key-pressed');
        }, { passive: true });
        btn.addEventListener('touchend', function(e) {
            e.currentTarget.classList.remove('np-key-pressed');
        }, { passive: true });
        /* 鼠标 fallback */
        btn.addEventListener('mousedown', function(e) {
            e.currentTarget.classList.add('np-key-pressed');
        });
        btn.addEventListener('mouseup', function(e) {
            e.currentTarget.classList.remove('np-key-pressed');
        });
        btn.addEventListener('mouseleave', function(e) {
            e.currentTarget.classList.remove('np-key-pressed');
        });
    });

    function sync() {
        var disp = document.getElementById('npDisplay');
        disp.value = _raw === '' ? '0' : _raw;
        disp.focus();
    }

    function open(targetInput, label) {
        _target = targetInput;
        _label  = label || '输入';
        _raw    = (targetInput.value || '').replace(/[^0-9]/g, '') || '';
        if (_raw === '' && targetInput.dataset.defaultValue) {
            _raw = targetInput.dataset.defaultValue;
        }

        var lbl = document.getElementById('npLabel');
        lbl.textContent = _label;

        sync();
        document.getElementById('numpad-overlay').classList.add('np-open');
        /* 禁止背景滚动 */
        document.body.style.overflow = 'hidden';
    }

    function close() {
        document.getElementById('numpad-overlay').classList.remove('np-open');
        document.body.style.overflow = '';
        if (_target) _target.focus();
    }

    function digit(d) {
        /* 最大 7 位，防止溢出 */
        if (_raw.replace('-', '').length >= 7) return;
        if (_raw === '0') {
            _raw = d;
        } else {
            _raw += d;
        }
        sync();
        triggerInput();
    }

    function clear() {
        _raw = '';
        sync();
        triggerInput();
    }

    function back() {
        if (_raw.length > 1) {
            _raw = _raw.slice(0, -1);
        } else {
            _raw = '';
        }
        sync();
        triggerInput();
    }

    function triggerInput() {
        /* 模拟 input 事件，通知业务逻辑 */
        if (_target && typeof Event === 'function') {
            _target.dispatchEvent(new Event('input', { bubbles: true }));
            _target.dispatchEvent(new Event('change',  { bubbles: true }));
        }
    }

    function confirm() {
        var finalVal = _raw === '' ? '' : _raw;
        if (_target) {
            _target.value = finalVal;
            triggerInput();
        }

        /* 关闭键盘 */
        close();

        /* 触发成功遮罩 */
        showSuccess(function() {
            /* 回调钩子 */
            if (typeof onNumpadConfirm === 'function') {
                onNumpadConfirm(_target, finalVal);
            }
        });
    }

    function showSuccess(onDone) {
        var el = document.getElementById('numpad-success');
        el.classList.remove('np-success-show');
        /* force reflow 以重置 animation */
        void el.offsetWidth;
        el.classList.add('np-success-show');
        setTimeout(function() {
            el.classList.remove('np-success-show');
            if (onDone) onDone();
        }, 1000);
    }

    /* 物理返回键 / ESC 关闭键盘 */
    document.addEventListener('keydown', function(e) {
        var overlay = document.getElementById('numpad-overlay');
        if (!overlay.classList.contains('np-open')) return;
        if (e.key === 'Escape' || e.key === 'Backspace' && document.activeElement === document.body) {
            close();
        }
    });

    /* 点击遮罩空白处关闭 */
    document.getElementById('numpad-overlay').addEventListener('click', function(e) {
        if (e.target === this) close();
    });

    return { open: open, close: close };
})();
</script>
