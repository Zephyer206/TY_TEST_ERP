<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>待修池 - TY_Tset_ERP</title>
    <style>
        /* ── Reset & Typography ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f0f2f5;
            color: #1a1a1a;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .topbar-sub { font-size: 12px; opacity: 0.7; margin-top: 2px; }
        /* ── Container ── */
        .container { max-width: 640px; margin: 0 auto; padding: 0 12px 100px; }

        /* ── 正在维修置顶卡片 ── */
        .pinned-section { padding-top: 14px; }

        .pinned-card {
            background: linear-gradient(135deg, #1e3a5f 0%, #1d4ed8 100%);
            border-radius: 18px;
            padding: 20px;
            color: white;
            box-shadow: 0 6px 24px rgba(29,78,216,0.45);
            margin-bottom: 6px;
        }
        .pinned-card .pin-label {
            display: inline-flex; align-items: center; gap: 5px;
            background: rgba(255,255,255,0.18);
            border-radius: 9999px; padding: 3px 12px;
            font-size: 11px; font-weight: 700; letter-spacing: 1px;
            margin-bottom: 14px;
        }
        .pinned-card .pin-label .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #60a5fa;
            animation: breathe 1.6s ease-in-out infinite;
        }
        .pinned-card .mold-number { font-size: 32px; font-weight: 900; letter-spacing: -0.5px; }
        .pinned-card .mold-meta { font-size: 13px; opacity: 0.75; margin-top: 4px; }
        .pinned-card .mold-info-row {
            display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px;
            background: rgba(255,255,255,0.1); border-radius: 12px; padding: 12px;
            font-size: 13px;
        }
        .pinned-card .info-chip {
            display: flex; flex-direction: column; gap: 2px;
        }
        .pinned-card .info-chip .label { font-size: 10px; opacity: 0.6; }
        .pinned-card .info-chip .value { font-weight: 700; }

        .pinned-card .timer-box {
            background: rgba(255,255,255,0.12); border-radius: 12px;
            padding: 14px; margin: 14px 0; text-align: center;
        }
        .pinned-card .timer-label { font-size: 11px; opacity: 0.65; margin-bottom: 4px; }
        .pinned-card .timer-value { font-size: 38px; font-weight: 900; letter-spacing: -1px; font-variant-numeric: tabular-nums; }

        /* 维修完成大按钮 */
        .btn-complete {
            width: 100%; padding: 18px; border: none; border-radius: 14px;
            background: #22c55e; color: white;
            font-size: 18px; font-weight: 900; letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(34,197,94,0.45);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-complete:active { transform: scale(0.97); box-shadow: none; }

        /* 放弃维修 */
        .btn-abandon {
            display: block; text-align: center; margin-top: 10px;
            color: rgba(255,255,255,0.45); font-size: 12px;
            text-decoration: none;
        }

        /* ── 搜索栏 ── */
        .search-bar {
            display: flex; gap: 8px; margin: 14px 0 12px;
        }
        .search-bar input {
            flex: 1; padding: 13px 16px; border: none; border-radius: 14px;
            font-size: 15px; background: white;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
            outline: none;
            transition: box-shadow 0.2s;
        }
        .search-bar input:focus { box-shadow: 0 0 0 2px #2563eb88; }
        .search-bar .btn-search {
            padding: 13px 20px; border: none; border-radius: 14px;
            background: #1e3a5f; color: white;
            font-size: 14px; font-weight: 700;
            cursor: pointer; white-space: nowrap;
            box-shadow: 0 2px 8px rgba(30,58,95,0.3);
        }
        .search-bar .btn-clear {
            padding: 13px 16px; border: none; border-radius: 14px;
            background: #e5e7eb; color: #6b7280;
            font-size: 14px; font-weight: 700; cursor: pointer;
            display: none;
        }
        .search-bar .btn-clear.visible { display: block; }

        /* ── 列表标题 ── */
        .list-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 10px;
        }
        .list-header .title {
            font-size: 13px; font-weight: 700; color: #374151;
            display: flex; align-items: center; gap: 6px;
        }
        .list-header .title::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; margin-left: 8px; }
        .list-header .count {
            background: #fee2e2; color: #dc2626; font-size: 11px; font-weight: 700;
            padding: 2px 8px; border-radius: 9999px;
        }

        /* ── 待修卡片 ── */
        .pool-list { display: flex; flex-direction: column; gap: 10px; }
        .pool-card {
            background: white; border-radius: 16px; padding: 18px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.06);
            border-left: 6px solid #dc2626;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
        .pool-card:active { transform: scale(0.98); box-shadow: none; }

        .pool-card .card-top {
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .pool-card .mold-num { font-size: 22px; font-weight: 900; color: #1f2937; }
        .pool-card .wait-badge {
            background: #fee2e2; color: #dc2626; font-size: 11px; font-weight: 700;
            padding: 3px 10px; border-radius: 9999px;
        }
        .pool-card .wait-badge.overdue {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: white;
        }
        .pool-card .machine-tag {
            font-size: 12px; color: #9ca3af; margin-top: 3px;
        }
        .pool-card .part-info {
            margin-top: 8px; padding: 8px 10px;
            background: #f9fafb; border-radius: 8px;
            font-size: 13px; color: #4b5563;
        }
        .pool-card .part-info span { color: #6b7280; font-size: 11px; }
        .pool-card .offline-time {
            margin-top: 8px; font-size: 12px; color: #9ca3af;
        }
        .pool-card .offline-time strong { color: #6b7280; }

        /* 开始维修大按钮 */
        .btn-start {
            width: 100%; margin-top: 14px; padding: 16px; border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #1e3a5f, #2563eb);
            color: white; font-size: 17px; font-weight: 900; letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37,99,235,0.35);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-start:active { transform: scale(0.97); box-shadow: none; }
        .btn-start:disabled {
            background: #9ca3af; box-shadow: none; cursor: not-allowed;
        }

        /* ── 空状态 ── */
        .empty-state { text-align: center; padding: 50px 16px; color: #9ca3af; }
        .empty-state .icon { font-size: 56px; margin-bottom: 14px; }
        .empty-state .msg { font-size: 16px; font-weight: 700; color: #6b7280; }
        .empty-state .sub { font-size: 13px; margin-top: 6px; }

        /* ── 下拉刷新提示 ── */
        .pull-hint {
            text-align: center; padding: 8px; font-size: 12px; color: #9ca3af;
            display: none;
        }
        .pull-hint.show { display: block; }

        /* ── 确认弹层（简约） ── */
        .confirm-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 500;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        .confirm-overlay.show { display: flex; }
        .confirm-box {
            background: white; border-radius: 20px; padding: 28px 24px;
            max-width: 360px; width: 100%; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .confirm-box .icon { font-size: 52px; margin-bottom: 12px; }
        .confirm-box .title { font-size: 20px; font-weight: 900; color: #1f2937; margin-bottom: 8px; }
        .confirm-box .desc { font-size: 14px; color: #6b7280; margin-bottom: 22px; }
        .confirm-box .btn-row { display: flex; gap: 10px; }
        .confirm-box .btn-cancel {
            flex: 1; padding: 14px; border: 2px solid #e5e7eb;
            border-radius: 14px; background: white;
            font-size: 15px; font-weight: 700; color: #6b7280;
            cursor: pointer;
        }
        .confirm-box .btn-confirm {
            flex: 1; padding: 14px; border: none; border-radius: 14px;
            background: #22c55e; color: white;
            font-size: 15px; font-weight: 900; cursor: pointer;
            box-shadow: 0 4px 14px rgba(34,197,94,0.4);
        }

        /* ── 底部导航 ── */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; border-top: 1px solid #e5e7eb;
            display: flex; z-index: 90;
            max-width: 640px; margin: 0 auto;
        }
        .nav-item {
            flex: 1; text-align: center; padding: 10px 4px;
            font-size: 11px; font-weight: 600; color: #6b7280;
            text-decoration: none; cursor: pointer;
            transition: color 0.15s;
        }
        .nav-item.active { color: #1e3a5f; }
        .nav-item .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }

        /* ── Toast ── */
        .toast {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            background: #1f2937; color: white;
            padding: 12px 24px; border-radius: 12px;
            font-size: 14px; font-weight: 600;
            z-index: 600; opacity: 0; transition: opacity 0.25s;
            pointer-events: none; white-space: nowrap;
        }
        .toast.show { opacity: 1; }
        .toast.error { background: #dc2626; }
        .toast.success { background: #16a34a; }

        /* ── 呼吸灯动画 ── */
        @keyframes breathe {
            0%, 100% { opacity: 0.6; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        /* ── Loading overlay ── */
        .page-loading {
            position: fixed; inset: 0; background: rgba(240,242,245,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 400; font-size: 14px; color: #6b7280;
        }
    </style>
</head>
<body>

{% include "common/_admin_nav.html" %}

<!-- ── Top Bar ── -->
<!-- ── Pull Hint ── -->
<div class="pull-hint" id="pullHint">↓ 下拉刷新</div>

<!-- ── Main Container ── -->
<div class="container" id="mainContainer">

    <!-- ── 正在维修置顶卡片 ── -->
    <div class="pinned-section" id="pinnedSection" style="display:none;">
        <div class="pinned-card" id="pinnedCard">
            <div class="pin-label">
                <span class="dot"></span>
                正在维修
            </div>
            <div class="mold-number" id="pinnedMoldNumber">--</div>
            <div class="mold-meta" id="pinnedMoldMeta"></div>
            <div class="mold-info-row" id="pinnedInfoRow"></div>
            <div class="timer-box">
                <div class="timer-label">离线总时长</div>
                <div class="timer-value" id="pinnedTimer">--:--</div>
            </div>
            <button class="btn-complete" id="btnComplete"
                    onclick="showConfirm('complete', this.dataset.id, this.dataset.mold)">
                维 修 完 成
            </button>
            <a href="javascript:void(0);" class="btn-abandon" id="btnAbandon" onclick="location.href='/tech/pool'">← 返回待修池</a>
        </div>
    </div>

    <!-- ── 搜索栏 ── -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索模具号 / 零件名…"
               autocomplete="off" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn-search" onclick="doSearch()">搜索</button>
        <button class="btn-clear" id="btnClear" onclick="clearSearch()">✕</button>
    </div>

    <!-- ── 待修列表 ── -->
    <div class="list-header">
        <div class="title">📋 待修模具 <span class="count" id="pendingCount">0</span></div>
    </div>

    <div class="pool-list" id="poolList"></div>

    <!-- ── 空状态 ── -->
    <div class="empty-state" id="emptyState" style="display:none;">
        <div class="icon">✅</div>
        <div class="msg" id="emptyMsg">暂无待修模具</div>
        <div class="sub">所有模具运行正常</div>
    </div>

</div><!-- /container -->

<!-- ── 底部导航 ── -->
<div class="bottom-nav">
    <a href="/" class="nav-item">
        <span class="nav-icon">🏠</span>首页
    </a>
    <a href="/tech/pool" class="nav-item active">
        <span class="nav-icon">🔧</span>待修池
    </a>
    <a href="/tech/scan" class="nav-item">
        <span class="nav-icon">📱</span>扫码
    </a>
    <a href="/tech/manager" class="nav-item">
        <span class="nav-icon">📊</span>看板
    </a>
</div>

<!-- ── 确认弹层 ── -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <div class="icon" id="confirmIcon">✅</div>
        <div class="title" id="confirmTitle">确认操作</div>
        <div class="desc" id="confirmDesc">确定要执行此操作吗？</div>
        <div class="btn-row">
            <button class="btn-cancel" onclick="closeConfirm()">取消</button>
            <button class="btn-confirm" id="confirmBtn" onclick="doConfirm()">确认</button>
        </div>
    </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<!-- ── Page Loading ── -->
<div class="page-loading" id="pageLoading">
    加载中…
</div>

<script>
    // ── 全局状态 ──
    var currentSearch = '';
    var pendingConfirm = null;  // { action, recordId, moldNumber }
    var autoRefreshTimer = null;
    var pinnedStartTime = null;

    // ── 页面初始化 ──
    window.addEventListener('DOMContentLoaded', function() {
        loadPool();
        startAutoRefresh();
        // 3分钟后停止自动刷新，节省电量
        setTimeout(stopAutoRefresh, 3 * 60 * 1000);
    });

    // ── 显示 Toast ──
    function showToast(msg, type) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'toast ' + (type || '');
        el.classList.add('show');
        setTimeout(function() { el.classList.remove('show'); }, 2500);
    }

    // ── 显示/隐藏加载 ──
    function setLoading(show) {
        var el = document.getElementById('pageLoading');
        if (el) el.style.display = show ? 'flex' : 'none';
    }

    // ── 加载待修池数据 ──
    function loadPool() {
        var url = '/tech/pool/json';
        if (currentSearch) url += '?search=' + encodeURIComponent(currentSearch);
        fetch(url)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data.success) { showToast(data.message || '加载失败', 'error'); return; }
                renderPinned(data.current);
                renderPending(data.pending);
            })
            .catch(function(e) {
                showToast('网络异常，请下拉刷新', 'error');
            })
            .finally(function() {
                setLoading(false);
                document.getElementById('pullHint').classList.remove('show');
            });
    }

    // ── 渲染置顶卡片 ──
    function renderPinned(current) {
        var section = document.getElementById('pinnedSection');
        if (!current) {
            section.style.display = 'none';
            return;
        }
        section.style.display = 'block';

        document.getElementById('pinnedMoldNumber').textContent =
            current.mold_number || current.machine_number || '--';
        document.getElementById('pinnedMoldMeta').textContent =
            '机台 ' + (current.machine_number || '--') +
            (current.mold_name ? ' · ' + current.mold_name : '');

        var infoRow = document.getElementById('pinnedInfoRow');
        var parts = [];
        if (current.current_part_number) parts.push('<div class="info-chip"><span class="label">零件号</span><span class="value">' + escHtml(current.current_part_number) + '</span></div>');
        if (current.current_part_name) parts.push('<div class="info-chip"><span class="label">零件名</span><span class="value">' + escHtml(current.current_part_name) + '</span></div>');
        parts.push('<div class="info-chip"><span class="label">离线</span><span class="value" style="color:#fbbf24">' + fmtMin(current.offline_minutes) + '</span></div>');
        infoRow.innerHTML = parts.join('');

        var btn = document.getElementById('btnComplete');
        btn.dataset.id = current.id;
        btn.dataset.mold = current.mold_number || '';

        // 计时器
        pinnedStartTime = current.repair_start_time ? new Date(current.repair_start_time) : null;
        updatePinnedTimer();
    }

    // ── 置顶计时器 ──
    function updatePinnedTimer() {
        var el = document.getElementById('pinnedTimer');
        if (!el) return;
        if (pinnedStartTime) {
            // 显示维修中计时（从 repair_start_time 到现在）
            var diffMs = new Date() - pinnedStartTime;
            var h = Math.floor(diffMs / 3600000);
            var m = Math.floor((diffMs % 3600000) / 60000);
            var s = Math.floor((diffMs % 60000) / 1000);
            el.textContent = (h > 0 ? h + 'h ' : '') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        } else {
            el.textContent = '--:--';
        }
    }
    setInterval(updatePinnedTimer, 1000);

    // ── 渲染待修列表 ──
    function renderPending(pending) {
        var list = document.getElementById('poolList');
        var empty = document.getElementById('emptyState');
        var count = document.getElementById('pendingCount');

        count.textContent = pending.length;

        if (pending.length === 0) {
            list.innerHTML = '';
            empty.style.display = 'block';
            document.getElementById('emptyMsg').textContent =
                currentSearch ? '没有匹配"' + escHtml(currentSearch) + '"的结果' : '暂无待修模具';
            return;
        }
        empty.style.display = 'none';

        list.innerHTML = pending.map(function(item) {
            var overdue = item.offline_minutes > 120;
            return '<div class="pool-card" onclick="startRepair(' + item.id + ', \'' + escAttr(item.mold_number || '') + '\')">' +
                '<div class="card-top">' +
                    '<div>' +
                        '<div class="mold-num">' + escHtml(item.mold_number || item.machine_number || '--') + '</div>' +
                        '<div class="machine-tag">机台 ' + escHtml(item.machine_number || '--') + '</div>' +
                    '</div>' +
                    '<div class="wait-badge' + (overdue ? ' overdue' : '') + '">' +
                        (overdue ? '⚠️ 超过2h' : '等候 ' + fmtMin(item.offline_minutes)) +
                    '</div>' +
                '</div>' +
                (item.current_part_name || item.current_part_number
                    ? '<div class="part-info">' +
                        (item.current_part_number ? '<span>零件号</span> ' + escHtml(item.current_part_number) : '') +
                        (item.current_part_name ? ' · <span>零件名</span> ' + escHtml(item.current_part_name) : '') +
                      '</div>'
                    : '') +
                '<div class="offline-time">下线时间：<strong>' +
                    (item.offline_minutes > 0 ? fmtMin(item.offline_minutes) + ' 前' : '刚刚') +
                '</strong></div>' +
                '<button class="btn-start" id="startBtn_' + item.id + '">开 始 维 修</button>' +
            '</div>';
        }).join('');
    }

    // ── 开始维修 ──
    function startRepair(recordId, moldNumber) {
        var btn = document.getElementById('startBtn_' + recordId);
        if (!btn) return;
        btn.disabled = true;
        btn.textContent = '处理中…';

        fetch('/tech/pool/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'record_id=' + recordId
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) {
                showToast(data.message, 'success');
                loadPool();
            } else {
                showToast(data.message, 'error');
                btn.disabled = false;
                btn.textContent = '开 始 维 修';
            }
        })
        .catch(function() {
            showToast('网络异常', 'error');
            btn.disabled = false;
            btn.textContent = '开 始 维 修';
        });
    }

    // ── 维修完成确认 ──
    function showConfirm(action, recordId, moldNumber) {
        pendingConfirm = { action: action, recordId: recordId, moldNumber: moldNumber };
        var overlay = document.getElementById('confirmOverlay');
        if (action === 'complete') {
            document.getElementById('confirmIcon').textContent = '✅';
            document.getElementById('confirmTitle').textContent = '确认维修完成？';
            document.getElementById('confirmDesc').textContent =
                '模具 ' + (moldNumber || '') + ' 将标记为「已修好待装机」';
        }
        overlay.classList.add('show');
    }

    function closeConfirm() {
        document.getElementById('confirmOverlay').classList.remove('show');
        pendingConfirm = null;
    }

    function doConfirm() {
        closeConfirm();
        if (!pendingConfirm) return;
        if (pendingConfirm.action === 'complete') {
            doComplete(pendingConfirm.recordId);
        }
    }

    function doComplete(recordId) {
        fetch('/tech/pool/complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'record_id=' + recordId
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) {
                showToast(data.message, 'success');
                loadPool();
            } else {
                showToast(data.message, 'error');
            }
        })
        .catch(function() { showToast('网络异常', 'error'); });
    }

    // ── 搜索 ──
    function doSearch() {
        var val = document.getElementById('searchInput').value.trim();
        currentSearch = val;
        document.getElementById('btnClear').classList.toggle('visible', !!val);
        setLoading(true);
        loadPool();
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        currentSearch = '';
        document.getElementById('btnClear').classList.remove('visible');
        setLoading(true);
        loadPool();
    }

    // ── 自动刷新 ──
    function startAutoRefresh() {
        if (autoRefreshTimer) return;
        autoRefreshTimer = setInterval(loadPool, 15000);  // 每15秒
    }
    function stopAutoRefresh() {
        if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
    }

    // ── 下拉刷新 ──
    var touchStartY = 0;
    document.addEventListener('touchstart', function(e) { touchStartY = e.touches[0].clientY; }, { passive: true });
    document.addEventListener('touchend', function(e) {
        var delta = e.changedTouches[0].clientY - touchStartY;
        if (delta > 60 && window.scrollY < 10) {
            var hint = document.getElementById('pullHint');
            hint.classList.add('show');
            setLoading(true);
            loadPool();
        }
    }, { passive: true });

    // ── 工具函数 ──
    function fmtMin(minutes) {
        if (!minutes && minutes !== 0) return '--';
        if (minutes < 60) return minutes + 'm';
        var h = Math.floor(minutes / 60);
        var m = minutes % 60;
        return (h > 0 ? h + 'h' : '') + (m > 0 ? m + 'm' : '');
    }

    function escHtml(s) {
        if (!s) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(s) {
        if (!s) return '';
        return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
</script>

</body>
</html>
