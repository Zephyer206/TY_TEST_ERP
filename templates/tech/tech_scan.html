<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>模修扫码 - TY_Tset_ERP</title>
    <style>
        /* ── 重置 & 全屏布局 ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f2942;
            color: white;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── 主容器 ── */
        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* ── 顶部区域 ── */
        .header {
            text-align: center;
            padding: 16px 0;
            flex-shrink: 0;
        }
        .user-info {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 8px;
        }
        .title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        /* ── 主扫码区域 ── */
        .scan-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
        }

        /* 扫码按钮 */
        .scan-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
            overflow: hidden;
        }
        .scan-btn:active {
            transform: scale(0.95);
        }
        .scan-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.3);
            animation: pulse-ring 2s ease-out infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .scan-icon { font-size: 64px; }
        .scan-text {
            font-size: 18px;
            font-weight: 700;
            color: white;
            letter-spacing: 4px;
        }

        /* ── 手动输入区 ── */
        .manual-input {
            width: 100%;
            max-width: 320px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-field {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field::placeholder { color: rgba(255,255,255,0.5); }
        .input-field:focus { border-color: #22c55e; }
        .submit-btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:active { background: #16a34a; }

        /* ── 结果展示区 ── */
        .result-area {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 24px;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .result-area.visible {
            opacity: 1;
            visibility: visible;
        }
        
        /* 结果状态颜色 */
        .result-area.status-offline { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .result-area.status-in_repair { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .result-area.status-ready_to_use { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .result-area.status-error { background: linear-gradient(135deg, #6b7280, #4b5563); }
        
        /* 结果图标 */
        .result-icon {
            font-size: 80px;
            animation: bounce-in 0.5s ease-out;
        }
        @keyframes bounce-in {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        /* 结果文字 */
        .result-title {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
        }
        .result-subtitle {
            font-size: 16px;
            opacity: 0.9;
            text-align: center;
            max-width: 300px;
        }
        
        /* 模具信息卡片 */
        .mold-info-card {
            background: rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            backdrop-filter: blur(10px);
        }
        .mold-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .mold-info-row:last-child { border-bottom: none; }
        .mold-info-label { opacity: 0.7; font-size: 14px; }
        .mold-info-value { font-weight: 700; font-size: 14px; }
        
        /* 返回按钮 */
        .back-btn {
            margin-top: 16px;
            padding: 14px 40px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 12px;
            background: transparent;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .back-btn:active {
            background: rgba(255,255,255,0.2);
        }

        /* ── 底部链接 ── */
        .footer {
            padding: 16px 0;
            text-align: center;
            flex-shrink: 0;
        }
        .footer a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 13px;
        }

        /* ── 加载动画 ── */
        .loading {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 41, 66, 0.95);
            z-index: 200;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
        }
        .loading.visible { display: flex; }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: white; font-size: 14px; }
    </style>
</head>
<body>

{% include "common/_admin_nav.html" %}

<div class="container" id="mainContainer">
    <!-- 顶部 -->
    <div class="header">
        <div class="user-info">{{ user.real_name }} · 模修师傅</div>
        <div class="title">🔧 模修扫码</div>
    </div>

    <!-- 主扫码区域 -->
    <div class="scan-area">
        <!-- 扫码按钮 -->
        <button class="scan-btn" onclick="openScanner()">
            <span class="scan-icon">📷</span>
            <span class="scan-text">扫 码</span>
        </button>

        <!-- 或手动输入 -->
        <div class="manual-input">
            <form id="manualForm" onsubmit="submitManual(event)">
                <div class="input-row">
                    <input type="text" class="input-field" id="moldKey" 
                           placeholder="输入模具/机台编号" autocomplete="off" required>
                    <button type="submit" class="submit-btn">确 定</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 底部链接 -->
    <div class="footer">
        <a href="/">← 返回主页</a>
    </div>
</div>

<!-- 结果展示区 -->
<div class="result-area" id="resultArea">
    <div class="result-icon" id="resultIcon">✅</div>
    <div class="result-title" id="resultTitle">状态更新</div>
    <div class="result-subtitle" id="resultSubtitle"></div>
    
    <div class="mold-info-card" id="moldInfo" style="display: none;">
        <div class="mold-info-row">
            <span class="mold-info-label">机台</span>
            <span class="mold-info-value" id="infoMachine">—</span>
        </div>
        <div class="mold-info-row">
            <span class="mold-info-label">模具</span>
            <span class="mold-info-value" id="infoMold">—</span>
        </div>
        <div class="mold-info-row">
            <span class="mold-info-label">零件</span>
            <span class="mold-info-value" id="infoPart">—</span>
        </div>
        <div class="mold-info-row">
            <span class="mold-info-label">故障原因</span>
            <span class="mold-info-value" id="infoFault">—</span>
        </div>
    </div>
    
    <button type="button" class="back-btn" onclick="closeResult()">继 续 扫 码</button>
    <button type="button" class="back-btn" id="poolLinkHint" style="display:none;background:#1e3a5f;margin-top:10px;"
            onclick="location.href='/tech/pool'">📋 进入待修池</button>
</div>

<!-- 加载动画 -->
<div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">处理中...</div>
</div>

<script>
    // ── 打开扫码（模拟，实际可调用相机 API）──
    function openScanner() {
        // 移动端调用相机扫码
        // 这里简化处理，直接聚焦到输入框
        document.getElementById('moldKey').focus();
        
        // 如果是移动端，可以尝试调用 BarcodeScanner API
        // 暂时通过手动输入实现
    }
    
    // ── 手动提交 ──
    async function submitManual(event) {
        event.preventDefault();
        const moldKey = document.getElementById('moldKey').value.trim();
        if (!moldKey) return;
        
        await processScan(moldKey);
    }
    
    // ── 处理扫码 ──
    async function processScan(moldKey) {
        showLoading(true);
        
        try {
            const response = await fetch('/tech/scan/process', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'mold_key=' + encodeURIComponent(moldKey)
            });
            
            const data = await response.json();
            showResult(data);
        } catch (error) {
            showResult({
                success: false,
                message: '网络错误，请重试',
                status: 'error'
            });
        } finally {
            showLoading(false);
        }
    }
    
    // ── 显示结果 ──
    function showResult(data) {
        const area = document.getElementById('resultArea');
        const icon = document.getElementById('resultIcon');
        const title = document.getElementById('resultTitle');
        const subtitle = document.getElementById('resultSubtitle');
        const moldInfo = document.getElementById('moldInfo');
        
        // 移除所有状态类
        area.classList.remove('status-offline', 'status-in_repair', 'status-ready_to_use', 'status-error');
        
        if (data.success) {
            // 根据动作类型显示不同结果
            if (data.action_type === 'start_repair') {
                area.classList.add('status-in_repair');
                icon.textContent = '🔧';
                title.textContent = '开始维修';
                subtitle.textContent = '请开始进行维修工作';
            } else if (data.action_type === 'complete_repair') {
                area.classList.add('status-ready_to_use');
                icon.textContent = '✅';
                title.textContent = '维修完成';
                subtitle.textContent = '该模具已修好，等待装机';
            } else if (data.action_type === 'already_done') {
                area.classList.add('status-ready_to_use');
                icon.textContent = '✓';
                title.textContent = '已完成';
                subtitle.textContent = '该模具已修好，待装机状态';
            } else if (data.action_type === 'not_owner') {
                area.classList.add('status-error');
                icon.textContent = '⚠';
                title.textContent = '无法操作';
                subtitle.textContent = data.message;
            } else {
                area.classList.add('status-offline');
                icon.textContent = '📋';
                title.textContent = data.message;
                subtitle.textContent = '状态：' + (data.status || '未知');
            }
        } else {
            area.classList.add('status-error');
            icon.textContent = '❌';
            title.textContent = '操作失败';
            subtitle.textContent = data.message;
        }
        
        // 显示模具信息
        if (data.mold_info) {
            moldInfo.style.display = 'block';
            document.getElementById('infoMachine').textContent = data.mold_info.machine_number || '—';
            document.getElementById('infoMold').textContent = data.mold_info.mold_number || '—';
            document.getElementById('infoPart').textContent = data.mold_info.current_part_number || '—';
            document.getElementById('infoFault').textContent = data.mold_info.fault_reason || '—';
        } else {
            moldInfo.style.display = 'none';
        }

        // 状态变化后提示可前往待修池
        if (data.action_type === 'start_repair' || data.action_type === 'complete_repair') {
            var poolHint = document.getElementById('poolLinkHint');
            if (poolHint) poolHint.style.display = 'inline-flex';
        }

        area.classList.add('visible');
    }

    // ── 关闭结果 ──
    function closeResult() {
        const area = document.getElementById('resultArea');
        area.classList.remove('visible');
        document.getElementById('moldKey').value = '';
        var poolHint = document.getElementById('poolLinkHint');
        if (poolHint) poolHint.style.display = 'none';
        document.getElementById('moldKey').focus();
    }

    // ── 加载状态 ──
    function showLoading(show) {
        document.getElementById('loading').classList.toggle('visible', show);
    }

    // ── 自动聚焦输入框 ──
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('moldKey').focus();
    });
</script>

</body>
</html>
