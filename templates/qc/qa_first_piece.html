<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>首件检验 - TY_ERP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f9ff; min-height: 100vh; }
        {% include "common/_admin_nav.html" %}
        .page-body { max-width: 520px; margin: 0 auto; padding: 20px 16px 80px; }

        .greet-card { background: linear-gradient(135deg, #0369a1, #0c4a6e); color: white; border-radius: 16px; padding: 20px 24px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(3,105,161,0.25); }
        .greet-title { font-size: 22px; font-weight: 800; }
        .greet-sub { font-size: 13px; opacity: 0.7; margin-top: 4px; }

        .guard-banner { background: #fffbeb; border: 2px solid #fde68a; border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; font-weight: 700; color: #92400e; text-align: center; }

        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 5px solid #3b82f6; }
        .card-title { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 14px; }

        .form-field { margin-bottom: 16px; }
        .form-label { font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .form-hint { font-weight: 400; font-size: 12px; color: #9ca3af; }
        .form-input { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; color: #0f172a; background: white; outline: none; transition: border-color 0.15s; }
        .form-input:focus { border-color: #3b82f6; }
        .form-input.pass { border-color: #22c55e; background: #f0fdf4; }
        .form-input.fail { border-color: #ef4444; background: #fef2f2; }
        textarea.form-input { resize: vertical; min-height: 80px; }

        .result-btn { display: flex; gap: 10px; margin-bottom: 16px; }
        .result-choice { flex: 1; padding: 16px; border-radius: 14px; border: 2px solid #e2e8f0; font-size: 16px; font-weight: 800; cursor: pointer; text-align: center; background: white; transition: all 0.15s; }
        .result-choice.pass { border-color: #22c55e; color: #15803d; }
        .result-choice.pass.selected { background: #dcfce7; border-color: #22c55e; }
        .result-choice.fail { border-color: #ef4444; color: #dc2626; }
        .result-choice.fail.selected { background: #fee2e2; border-color: #ef4444; }

        .submit-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 17px; font-weight: 800; cursor: pointer; color: white; background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 6px 24px rgba(59,130,246,0.35); transition: transform 0.15s; }
        .submit-btn:active { transform: scale(0.97); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .success-overlay { display: none; position: fixed; inset: 0; background: rgba(34,197,94,0.92); z-index: 200; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .success-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
        .success-icon { font-size: 80px; margin-bottom: 16px; animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
        .success-text { font-size: 28px; font-weight: 900; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { transform: scale(0.5); } to { transform: scale(1); } }

        .help-text { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    </style>
</head>
<body>
{% include "common/_admin_nav.html" %}

<div class="success-overlay" id="successOverlay">
    <div class="success-icon">&#10004;</div>
    <div class="success-text" id="successText">首件已放行</div>
</div>

<div class="page-body">

    <div class="greet-card">
        <div class="greet-title">首件检验</div>
        <div class="greet-sub">首件 QA 放行后，方可开始工单报工</div>
    </div>

    <div class="guard-banner">
        首件检验必须由质检人员或授权技术员完成，检验结果将永久记录
    </div>

    <!-- 工单选择 -->
    <div class="card">
        <div class="card-title">选择工单</div>
        <div class="form-field">
            <label class="form-label">
                工单号
                <span class="form-hint">扫码或输入</span>
            </label>
            <input type="text" class="form-input" id="woInput"
                   placeholder="扫码或输入工单号，如 WO-260513-001">
        </div>
        <div id="woInfo" style="display:none; margin-top:12px; padding:12px; background:#f0f9ff; border-radius:10px; font-size:13px;">
            <div style="font-weight:800; margin-bottom:4px;" id="woDisplay"></div>
            <div id="fpStatus"></div>
        </div>
    </div>

    <!-- 检验结果 -->
    <div class="card" id="inspectCard" style="display:none;">
        <div class="card-title">检验结果</div>

        <div class="form-field">
            <label class="form-label">尺寸检验</label>
            <div class="result-btn">
                <div class="result-choice pass" onclick="selectResult(this, 'dim')">&#10004; 合格</div>
                <div class="result-choice fail" onclick="selectResult(this, 'dim')">&#10008; 不合格</div>
            </div>
        </div>

        <div class="form-field">
            <label class="form-label">外观检验</label>
            <div class="result-btn">
                <div class="result-choice pass" onclick="selectResult(this, 'appear')">&#10004; 合格</div>
                <div class="result-choice fail" onclick="selectResult(this, 'appear')">&#10008; 不合格</div>
            </div>
        </div>

        <div class="form-field">
            <label class="form-label">功能检验</label>
            <div class="result-btn">
                <div class="result-choice pass" onclick="selectResult(this, 'func')">&#10004; 合格</div>
                <div class="result-choice fail" onclick="selectResult(this, 'func')">&#10008; 不合格</div>
            </div>
        </div>

        <div class="form-field">
            <label class="form-label">备注</label>
            <textarea class="form-input" id="remarkInput"
                      placeholder="检验说明、异常描述等（选填）"></textarea>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="submitInspect()">
            &#10004; 确认放行 / 不合格
        </button>
    </div>

</div>

<script>
var selectedWoId = null;
var result = { dim: null, appear: null, func: null };

// 工单查询
document.getElementById('woInput').addEventListener('change', async function() {
    var key = this.value.trim();
    if (!key) return;
    try {
        var r = await fetch('/prod/orders/json');
        var j = await r.json();
        var found = (j.find || [])(function(wo) { return wo.order_no === key || String(wo.id) === key; });
        if (!found && Array.isArray(j)) {
            found = j.find(function(wo) { return wo.order_no === key || String(wo.id) === key; });
        }
        if (found) {
            selectedWoId = found.id;
            var infoEl = document.getElementById('woInfo');
            infoEl.style.display = 'block';
            document.getElementById('woDisplay').textContent =
                found.order_no + ' | ' + found.part_number + ' | ' +
                found.produced_qty + '/' + found.target_qty + ' 件';
            var fpEl = document.getElementById('fpStatus');
            if (found.is_first_piece_required) {
                if (found.first_piece_passed_at) {
                    fpEl.innerHTML = '<span style="color:#15803d; font-weight:700;">&#10004; 已放行</span>';
                    document.getElementById('inspectCard').style.display = 'none';
                } else {
                    fpEl.innerHTML = '<span style="color:#d97706; font-weight:700;">&#9203; 待首件检验</span>';
                    document.getElementById('inspectCard').style.display = 'block';
                }
            } else {
                fpEl.innerHTML = '<span style="color:#94a3b8;">无需首件检验</span>';
                document.getElementById('inspectCard').style.display = 'none';
            }
        } else {
            alert('未找到工单：' + key);
        }
    } catch(e) { alert('网络错误：' + e); }
});

function selectResult(el, type) {
    var parent = el.parentElement;
    parent.querySelectorAll('.result-choice').forEach(function(c) { c.classList.remove('selected'); });
    el.classList.add('selected');
    result[type] = el.classList.contains('pass') ? 'pass' : 'fail';
}

async function submitInspect() {
    if (!selectedWoId) { alert('请先选择工单'); return; }

    var allPass = result.dim === 'pass' && result.appear === 'pass' && result.func === 'pass';
    var anyFail = result.dim === 'fail' || result.appear === 'fail' || result.func === 'fail';

    if (!allPass && !anyFail) {
        alert('请完成所有检验项目');
        return;
    }

    var fd = new FormData();
    fd.append('work_order_id', selectedWoId);

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '提交中...';

    try {
        var r = await fetch('/prod/shopfloor/first-piece/approve', {method: 'POST', body: fd});
        var j = await r.json();
        if (j.code === 0) {
            document.getElementById('successOverlay').classList.add('show');
            setTimeout(function() {
                document.getElementById('successOverlay').classList.remove('show');
                location.reload();
            }, 2000);
        } else {
            alert(j.message || '提交失败');
        }
    } catch(e) { alert('网络错误：' + e); }
    finally {
        btn.disabled = false;
        btn.textContent = '\u2714 确认放行 / 不合格';
    }
}
</script>
</body>
</html>
