<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>巡检扫码 - TY_Tset_ERP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .page-body { padding: 16px; max-width: 480px; margin: 0 auto; }

        .greet-card {
            border-radius: 16px;
            padding: 20px;
            color: white;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            box-shadow: 0 4px 12px rgba(124,58,237,0.3);
        }
        .greet-icon  { font-size: 28px; margin-bottom: 6px; }
        .greet-title { font-size: 18px; font-weight: 800; }
        .greet-sub   { font-size: 12px; opacity: 0.85; margin-top: 4px; }

        .scan-btn {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            color: white;
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 16px;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(124,58,237,0.4);
            animation: scan-blink 2s ease-in-out infinite;
        }
        @keyframes scan-blink {
            0%,100% { box-shadow: 0 4px 16px rgba(124,58,237,0.4); }
            50%      { box-shadow: 0 4px 28px rgba(124,58,237,0.7); }
        }
        .scan-btn-icon   { font-size: 40px; }
        .scan-btn-title  { font-size: 20px; font-weight: 800; }
        .scan-btn-sub    { font-size: 12px; opacity: 0.85; margin-top: 4px; }

        .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .type-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            border: 2px solid #ddd6fe;
            border-radius: 12px;
            padding: 14px 8px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s, border-color 0.15s;
        }
        .type-btn:hover, .type-btn.active {
            border-color: #9333ea;
            background: #f5f3ff;
            transform: scale(0.97);
        }
        .type-icon { font-size: 24px; margin-bottom: 6px; }
        .type-label { font-size: 12px; font-weight: 700; color: #374151; }
        .type-sub { font-size: 10px; color: #9ca3af; margin-top: 2px; }

        .qc-form {
            background: #f5f3ff;
            border-radius: 12px;
            padding: 16px;
            margin-top: 10px;
            display: none;
        }
        .qc-form.active { display: block; }
        .form-row { display: flex; align-items: center; margin-bottom: 12px; gap: 10px; }
        .form-label { font-size: 13px; font-weight: 700; color: #374151; min-width: 70px; }
        .form-input {
            flex: 1;
            padding: 10px 12px;
            border: 1.5px solid #ddd6fe;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            background: white;
            text-align: center;
            outline: none;
        }
        .form-input:focus { border-color: #9333ea; box-shadow: 0 0 0 3px rgba(147,51,234,0.15); }
        .form-select {
            flex: 1;
            padding: 10px 12px;
            border: 1.5px solid #ddd6fe;
            border-radius: 10px;
            font-size: 13px;
            background: white;
            outline: none;
        }

        .result-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .result-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #ddd6fe;
            background: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .result-btn.selected { border-color: #9333ea; background: #f5f3ff; color: #7c3aed; }
        .result-btn.pass.selected { border-color: #16a34a; background: #f0fdf4; color: #16a34a; }
        .result-btn.fail.selected { border-color: #dc2626; background: #fef2f2; color: #dc2626; }

        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-success { background: #16a34a; color: white; width: 100%; font-size: 16px; padding: 14px; }
        .btn-success:hover { background: #15803d; }
        .btn-cancel { background: #f3f4f6; color: #6b7280; width: 100%; margin-top: 8px; }

        .task-card {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border-left: 4px solid #9333ea;
        }
        .task-pn { font-size: 14px; font-weight: 700; color: #111827; }
        .task-name { font-size: 12px; color: #9ca3af; margin-top: 2px; }
        .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 700; }
        .badge-orange { background: #ffedd5; color: #ea580c; }
        .badge-purple { background: #f5f3ff; color: #7c3aed; }
    </style>
</head>
<body>

{% include "common/_admin_nav.html" %}

<div class="page-body">

    <div class="greet-card">
        <div class="greet-icon">🔬</div>
        <div class="greet-title">您好，{{ user.real_name }}</div>
        <div class="greet-sub">样件/机台巡检 · 快速记录</div>
    </div>

    <!-- 巡检类型选择 -->
    <div class="task-title">🔬 选择巡检类型</div>
    <div class="type-grid">
        <a href="javascript:void(0)" class="type-btn" id="type-first_piece" onclick="selectType('first_piece')">
            <div class="type-icon">✏️</div>
            <div class="type-label">样件确认</div>
            <div class="type-sub">首件检验</div>
        </a>
        <a href="javascript:void(0)" class="type-btn" id="type-patrol" onclick="selectType('patrol')">
            <div class="type-icon">🔧</div>
            <div class="type-label">机台巡检</div>
            <div class="type-sub">过程抽检</div>
        </a>
        <a href="javascript:void(0)" class="type-btn" id="type-oqc" onclick="selectType('oqc')">
            <div class="type-icon">📦</div>
            <div class="type-label">出货检验</div>
            <div class="type-sub">OQC 抽检</div>
        </a>
    </div>

    <!-- 扫码录入区（极简） -->
    <div class="task-title">📋 扫码录入</div>
    <div class="task-card" id="form-card">
        <div style="font-size:13px; color:#6b7280; text-align:center; padding:20px;">
            点击上方类型后，输入零件编号开始巡检
        </div>
    </div>

    <!-- 动态表单 -->
    <div class="qc-form" id="qc-form">
        <input type="hidden" name="inspection_type" id="f-type" value="">
        <input type="hidden" name="result" id="f-result" value="">

        <div style="margin-bottom:14px;">
            <div style="font-size:12px; font-weight:700; color:#7c3aed; margin-bottom:8px;">
                当前类型：<span id="f-type-label">—</span>
            </div>
        </div>

        <!-- 零件编号输入 -->
        <div class="form-row">
            <label class="form-label">零件号</label>
            <input type="text" name="part_number" id="f-part-number" class="form-input"
                   placeholder="扫码或输入零件编号" autocomplete="off">
        </div>

        <!-- 结果选择 -->
        <div class="form-row" style="flex-direction:column; align-items:stretch;">
            <div class="form-label" style="margin-bottom:8px;">检验结果</div>
            <div class="result-row">
                <button type="button" class="result-btn pass" id="btn-pass"
                        onclick="selectResult('pass')">✅ 合格</button>
                <button type="button" class="result-btn fail" id="btn-fail"
                        onclick="selectResult('fail')">❌ 不合格</button>
            </div>
        </div>

        <!-- 不合格原因（动态显示） -->
        <div class="form-row" id="reason-row" style="display:none;">
            <label class="form-label">不合格原因</label>
            <select name="defect_reason" id="f-reason" class="form-select">
                <option value="">— 选择原因 —</option>
                <option>尺寸超差</option>
                <option>表面划伤</option>
                <option>毛刺超标</option>
                <option>变形/翘曲</option>
                <option>材质异常</option>
                <option>其他</option>
            </select>
        </div>

        <!-- 备注 -->
        <div class="form-row">
            <label class="form-label">备注</label>
            <input type="text" name="remark" id="f-remark" class="form-input" placeholder="选填">
        </div>

        <!-- 警告提示 -->
        <div id="block-warning" style="display:none; background:#fef2f2; border:1.5px solid #fecaca; border-radius:10px; padding:12px; margin-bottom:12px; text-align:center;">
            <div style="font-size:13px; font-weight:700; color:#dc2626; margin-bottom:4px;">⚠️ 不合格将卡控该批次</div>
            <div style="font-size:11px; color:#dc2626;">卡控后需主管解除才能发货</div>
        </div>

        <button type="button" class="btn btn-success" id="btn-submit" onclick="submitForm()">
            ✅ 提交巡检记录
        </button>
        <button type="button" class="btn btn-cancel" onclick="cancelForm()">取消</button>
    </div>

</div>

<script>
var selectedType = '';
var selectedResult = '';

function selectType(type) {
    selectedType = type;
    document.querySelectorAll('.type-btn').forEach(function(b){ b.classList.remove('active'); });
    document.getElementById('type-' + type).classList.add('active');

    var labels = {'first_piece':'样件确认','patrol':'机台巡检','oqc':'出货检验'};
    document.getElementById('f-type').value = type;
    document.getElementById('f-type-label').textContent = labels[type] || type;
    document.getElementById('form-card').style.display = 'none';
    document.getElementById('qc-form').classList.add('active');
    document.getElementById('f-part-number').focus();
}

function selectResult(res) {
    selectedResult = res;
    document.getElementById('btn-pass').classList.toggle('selected', res === 'pass');
    document.getElementById('btn-fail').classList.toggle('selected', res === 'fail');
    document.getElementById('f-result').value = res;
    document.getElementById('reason-row').style.display = (res === 'fail') ? 'flex' : 'none';
    document.getElementById('block-warning').style.display = (res === 'fail') ? 'block' : 'none';
}

function cancelForm() {
    document.getElementById('qc-form').classList.remove('active');
    document.getElementById('form-card').style.display = 'block';
    document.getElementById('btn-pass').classList.remove('selected');
    document.getElementById('btn-fail').classList.remove('selected');
    selectedResult = '';
    selectedType = '';
}

function submitForm() {
    var partNumber = document.getElementById('f-part-number').value.trim();
    if (!partNumber) { alert('请输入零件编号'); return; }
    if (!selectedType) { alert('请先选择巡检类型'); return; }
    if (!selectedResult) { alert('请选择检验结果'); return; }
    if (selectedResult === 'fail') {
        if (!confirm('不合格将卡控该批次，确认提交？')) return;
    }

    var form = document.createElement('form');
    form.method = 'POST';
    form.action = '/qc/inspect';
    var fields = {
        'inspection_type': selectedType,
        'result': selectedResult,
        'part_id': '1',
        'defect_reason': document.getElementById('f-reason').value,
        'remark': document.getElementById('f-remark').value
    };
    for (var k in fields) {
        var inp = document.createElement('input');
        inp.type = 'hidden'; inp.name = k; inp.value = fields[k];
        form.appendChild(inp);
    }
    // 零件编号转 part_id（这里用零件编号查找，实际提交时后端处理）
    var inp2 = document.createElement('input');
    inp2.type = 'hidden'; inp2.name = 'part_number'; inp2.value = partNumber;
    form.appendChild(inp2);
    document.body.appendChild(form);
    form.submit();
}
</script>
</body>
</html>
