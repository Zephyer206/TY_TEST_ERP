<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>全检扫码 - TY_Tset_ERP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .page-body { padding: 16px; max-width: 480px; margin: 0 auto; }

        /* ── 问候卡 ── */
        .greet-card {
            border-radius: 16px;
            padding: 20px;
            color: white;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            box-shadow: 0 4px 12px rgba(124,58,237,0.3);
        }
        .greet-icon  { font-size: 28px; margin-bottom: 6px; }
        .greet-title { font-size: 18px; font-weight: 800; }
        .greet-sub   { font-size: 12px; opacity: 0.85; margin-top: 4px; }

        /* ── 扫描按钮 ── */
        .scan-btn {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            color: white;
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 16px;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(124,58,237,0.4);
            animation: scan-blink 2s ease-in-out infinite;
        }
        @keyframes scan-blink {
            0%,100% { box-shadow: 0 4px 16px rgba(124,58,237,0.4); }
            50%      { box-shadow: 0 4px 28px rgba(124,58,237,0.7); }
        }
        .scan-btn-icon   { font-size: 40px; }
        .scan-btn-title  { font-size: 20px; font-weight: 800; }
        .scan-btn-sub    { font-size: 12px; opacity: 0.85; margin-top: 4px; }

        /* ── 任务卡片 ── */
        .task-title { font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 10px; }
        .task-card {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border-left: 4px solid #9333ea;
        }
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .task-pn   { font-size: 14px; font-weight: 700; color: #111827; }
        .task-name { font-size: 12px; color: #9ca3af; margin-top: 2px; }
        .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 700; }
        .badge-orange { background: #ffedd5; color: #ea580c; }

        /* ── 展开表单 ── */
        .qc-form {
            background: #f5f3ff;
            border-radius: 12px;
            padding: 16px;
            margin-top: 10px;
            display: none;
        }
        .qc-form.active { display: block; }
        .form-row { display: flex; align-items: center; margin-bottom: 12px; gap: 10px; }
        .form-label { font-size: 13px; font-weight: 700; color: #374151; min-width: 70px; }
        .form-input {
            flex: 1;
            padding: 10px 12px;
            border: 1.5px solid #ddd6fe;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            background: white;
            text-align: center;
            outline: none;
        }
        .form-input:focus { border-color: #9333ea; box-shadow: 0 0 0 3px rgba(147,51,234,0.15); }
        .form-select {
            flex: 1;
            padding: 10px 12px;
            border: 1.5px solid #ddd6fe;
            border-radius: 10px;
            font-size: 13px;
            background: white;
            outline: none;
        }

        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-success { background: #16a34a; color: white; width: 100%; font-size: 16px; padding: 14px; }
        .btn-success:hover { background: #15803d; }
        .btn-cancel { background: #f3f4f6; color: #6b7280; width: 100%; margin-top: 8px; }

        .empty-box { background: white; border-radius: 12px; padding: 40px 20px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .empty-icon { font-size: 40px; margin-bottom: 8px; }
        .empty-title { font-size: 14px; font-weight: 700; color: #374151; }
        .empty-sub   { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    </style>
</head>
<body>

<!-- 顶部导航 -->
{% include "common/_admin_nav.html" %}

<div class="page-body">

    <!-- 问候卡 -->
    <div class="greet-card">
        <div class="greet-icon">🔍</div>
        <div class="greet-title">您好，{{ user.real_name }}</div>
        <div class="greet-sub">全检扫码 · 快速录入</div>
    </div>

    <!-- 待检产品列表 -->
    <div class="task-title">📋 待检产品</div>
    {% if pending_parts %}
        {% for item in pending_parts %}
        <div class="task-card" id="card-{{ item.part_id }}">
            <div class="task-header">
                <div>
                    <div class="task-pn">{{ item.part_number }}</div>
                    <div class="task-name">{{ item.internal_name }}</div>
                </div>
                <span class="badge badge-orange">{{ item.pending_qty }} 件</span>
            </div>
            <button class="btn" onclick="toggleForm({{ item.part_id }})"
                    style="width:100%; background:#f5f3ff; color:#7c3aed; border:1.5px solid #ddd6fe; padding:10px; border-radius:10px;">
                📋 登记全检
            </button>

            <!-- 全检登记表单 -->
            <form class="qc-form" id="form-{{ item.part_id }}"
                  action="/qc/submit" method="post"
                  onsubmit="return validateForm({{ item.part_id }});">
                <input type="hidden" name="part_id"    value="{{ item.part_id }}">
                <input type="hidden" name="result"     value="pass">

                <div style="font-size:12px; font-weight:700; color:#7c3aed; margin-bottom:10px;">
                    登记：{{ item.part_number }}
                </div>

                <div class="form-row">
                    <label class="form-label">检验数</label>
                    <input type="number" name="qty_checked" class="form-input"
                           id="qc-{{ item.part_id }}-checked"
                           placeholder="0" min="0" required
                           oninput="calcPass({{ item.part_id }})">
                </div>

                <div class="form-row">
                    <label class="form-label">合格数</label>
                    <input type="number" name="qty_passed" class="form-input"
                           id="qc-{{ item.part_id }}-passed"
                           placeholder="0" min="0" required
                           oninput="calcFail({{ item.part_id }})">
                </div>

                <div class="form-row">
                    <label class="form-label">不合格</label>
                    <input type="number" name="qty_failed" class="form-input"
                           id="qc-{{ item.part_id }}-failed"
                           placeholder="0" min="0" value="0">
                </div>

                <div class="form-row" style="margin-bottom:12px;">
                    <label class="form-label">原因</label>
                    <select name="defect_reason" class="form-select">
                        <option value="">— 不合格原因 —</option>
                        <option>尺寸超差</option>
                        <option>表面划伤</option>
                        <option>毛刺超标</option>
                        <option>变形/翘曲</option>
                        <option>材质异常</option>
                        <option>其他</option>
                    </select>
                </div>

                <div class="form-row">
                    <label class="form-label">备注</label>
                    <input type="text" name="remark" class="form-input"
                           placeholder="选填">
                </div>

                <button type="button" class="btn btn-success">✅ 提交全检记录</button>
                <button type="button" class="btn btn-cancel"
                        onclick="toggleForm({{ item.part_id }})">取消</button>
            </form>
        </div>
        {% endfor %}
    {% else %}
        <div class="empty-box">
            <div class="empty-icon">✅</div>
            <div class="empty-title">暂无待检产品</div>
            <div class="empty-sub">今日产品已全部检验</div>
        </div>
    {% endif %}

</div>

<script>
function toggleForm(partId) {
    var form = document.getElementById('form-' + partId);
    form.classList.toggle('active');
    if (form.classList.contains('active')) {
        // 自动聚焦到第一个输入框
        var inp = form.querySelector('input[name="qty_checked"]');
        if (inp) inp.focus();
    }
}

function calcPass(partId) {
    var checked = parseInt(document.getElementById('qc-' + partId + '-checked').value) || 0;
    var passed  = document.getElementById('qc-' + partId + '-passed');
    var failed  = document.getElementById('qc-' + partId + '-failed');
    if (passed.value === '' || parseInt(passed.value) > checked) {
        passed.value = checked;
        failed.value = 0;
    }
}

function calcFail(partId) {
    var checked = parseInt(document.getElementById('qc-' + partId + '-checked').value) || 0;
    var passed  = parseInt(document.getElementById('qc-' + partId + '-passed').value)  || 0;
    var failed  = document.getElementById('qc-' + partId + '-failed');
    failed.value = Math.max(0, checked - passed);
}

function validateForm(partId) {
    var checked = parseInt(document.getElementById('qc-' + partId + '-checked').value) || 0;
    var passed  = parseInt(document.getElementById('qc-' + partId + '-passed').value)  || 0;
    if (checked <= 0) {
        alert('请输入检验数量');
        return false;
    }
    if (passed < 0 || passed > checked) {
        alert('合格数不能大于检验数');
        return false;
    }
    return true;
}
</script>
</body>
</html>
