<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>强行特赦放行 - TY_ERP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f9ff; min-height: 100vh; }
        {% include "common/_admin_nav.html" %}
        .page-body { max-width: 560px; margin: 0 auto; padding: 20px 16px 80px; }
        .greet-card { background: linear-gradient(135deg, #dc2626, #991b1b); color: white; border-radius: 16px; padding: 20px 24px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(220,38,38,0.25); }
        .greet-title { font-size: 22px; font-weight: 800; }
        .greet-sub { font-size: 13px; opacity: 0.8; margin-top: 4px; }
        .warn-banner { background: #fff1f2; border: 2px solid #fda4af; border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #9f1239; font-weight: 700; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 5px solid #dc2626; }
        .card-title { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 14px; }
        .form-field { margin-bottom: 16px; }
        .form-label { font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; color: #0f172a; background: white; outline: none; transition: border-color 0.15s; }
        .form-input:focus { border-color: #dc2626; }
        textarea.form-input { resize: vertical; min-height: 100px; }
        .submit-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 17px; font-weight: 800; cursor: pointer; color: white; background: linear-gradient(135deg, #dc2626, #b91c1c); box-shadow: 0 6px 24px rgba(220,38,38,0.35); transition: transform 0.15s; }
        .submit-btn:active { transform: scale(0.97); }
        .success-overlay { display: none; position: fixed; inset: 0; background: rgba(34,197,94,0.92); z-index: 200; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .success-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
        .success-icon { font-size: 80px; margin-bottom: 16px; }
        .success-text { font-size: 28px; font-weight: 900; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .msg-error { background: #fef2f2; border: 2px solid #fca5a5; border-radius: 10px; padding: 10px 14px; color: #dc2626; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
{% include "common/_admin_nav.html" %}
<div class="page-body">
    <div class="greet-card">
        <div class="greet-title">强行特赦放行</div>
        <div class="greet-sub">{{ user.dept }} | {{ user.username }} | admin 级别</div>
    </div>

    <div class="warn-banner">
        &#9888; 强行特赦将绕过所有品质限制强制解锁报工。此操作不可逆，请务必填写详细原因。
    </div>

    <div class="card">
        <div class="card-title">特赦参数</div>
        <div class="form-field">
            <label class="form-label">工单 ID *</label>
            <input class="form-input" type="number" id="wo_id" placeholder="输入工单 ID" min="1">
        </div>
        <div class="form-field">
            <label class="form-label">关联机台 ID</label>
            <input class="form-input" type="number" id="machine_id" placeholder="输入机台 ID（可选）" min="0">
        </div>
        <div class="form-field">
            <label class="form-label">特赦原因 *（必填，不可为空）</label>
            <textarea class="form-input" id="reason" placeholder="请填写详细原因，如：客户急单交期紧急，特批..."></textarea>
        </div>
        <button class="submit-btn" onclick="submitEmergency()">确认特赦放行</button>
        <div class="msg-error" id="error_msg"></div>
    </div>
</div>

<div class="success-overlay" id="success_overlay" onclick="hideSuccess()">
    <div class="success-icon">&#10003;</div>
    <div class="success-text">特赦成功</div>
</div>

<script src="/static/js/api_config.js"></script>
<script>
async function submitEmergency() {
    var woId = parseInt(document.getElementById('wo_id').value);
    var machineId = parseInt(document.getElementById('machine_id').value) || 0;
    var reason = document.getElementById('reason').value.trim();
    if (!woId) { showError('请输入工单 ID'); return; }
    if (!reason) { showError('特赦原因不能为空'); return; }
    document.getElementById('error_msg').style.display = 'none';
    try {
        var res = await apiPost('qa.emergency_release', {
            work_order_id: woId,
            machine_id: machineId,
            reason: reason
        });
        if (res.code === 0) {
            document.getElementById('success_overlay').classList.add('show');
            document.getElementById('wo_id').value = '';
            document.getElementById('reason').value = '';
        } else {
            showError(res.message || '特赦失败');
        }
    } catch(e) { showError('网络错误: ' + e.message); }
}
function showError(msg) {
    var el = document.getElementById('error_msg');
    el.textContent = msg;
    el.style.display = 'block';
}
function hideSuccess() { document.getElementById('success_overlay').classList.remove('show'); }
</script>
</body>
</html>
