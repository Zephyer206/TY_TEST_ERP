<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>库存管理 - TY_ERP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; }
        {% include "common/_admin_nav.html" %}
        .page-body { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }

        /* ── 顶部工具栏 ── */
        .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .page-title { font-size: 20px; font-weight: 800; color: #0f172a; flex: 1; }

        /* ── Tab 切换 ── */
        .tabs { display: flex; gap: 4px; background: #e2e8f0; border-radius: 10px; padding: 4px; }
        .tab-btn { padding: 7px 20px; border-radius: 7px; border: none; font-size: 13px; font-weight: 700;
                   cursor: pointer; background: transparent; color: #64748b; transition: all .15s; }
        .tab-btn.active { background: white; color: #0f172a; box-shadow: 0 1px 4px rgba(0,0,0,.12); }

        /* ── 客户过滤 ── */
        .filter-bar { display: flex; align-items: center; gap: 10px; }
        .filter-label { font-size: 13px; font-weight: 600; color: #475569; white-space: nowrap; }
        select.cust-select { padding: 7px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px;
                             font-size: 13px; color: #1e293b; background: white; cursor: pointer;
                             min-width: 160px; }
        select.cust-select:focus { outline: none; border-color: #6366f1; }

        /* ── 搜索框 ── */
        .search-box { padding: 7px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px;
                      font-size: 13px; color: #1e293b; background: white; width: 200px; }
        .search-box:focus { outline: none; border-color: #6366f1; }

        /* ── 统计条 ── */
        .stat-bar { display: flex; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
        .stat-chip { background: white; border-radius: 10px; padding: 10px 18px;
                     box-shadow: 0 1px 4px rgba(0,0,0,.06); }
        .stat-chip .val { font-size: 22px; font-weight: 800; color: #0f172a; }
        .stat-chip .lbl { font-size: 11px; color: #94a3b8; font-weight: 600; margin-top: 2px; }

        /* ── 表格 ── */
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 700; color: #94a3b8;
             text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #f1f5f9;
             background: #f8fafc; white-space: nowrap; }
        td { padding: 12px 14px; font-size: 13px; color: #1e293b; border-bottom: 1px solid #f8fafc; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fafc; }

        .part-no { font-weight: 700; color: #0f172a; font-size: 13px; }
        .part-name { font-size: 11px; color: #94a3b8; margin-top: 2px; }
        .cust-no { font-size: 12px; color: #475569; }
        .cust-name-cell { font-size: 12px; font-weight: 600; color: #334155; }
        .location-badge { display: inline-flex; padding: 2px 8px; border-radius: 6px;
                          background: #f1f5f9; color: #475569; font-size: 11px; font-weight: 700; }
        .qty-cell { font-size: 18px; font-weight: 800; color: #0f172a; }
        .qty-zero { color: #cbd5e1; }

        /* ── 操作按钮 ── */
        .btn-in  { padding: 5px 12px; border-radius: 7px; border: none; font-size: 12px; font-weight: 700;
                   cursor: pointer; background: #dcfce7; color: #15803d; }
        .btn-out { padding: 5px 12px; border-radius: 7px; border: none; font-size: 12px; font-weight: 700;
                   cursor: pointer; background: #fee2e2; color: #dc2626; }
        .btn-in:hover  { background: #bbf7d0; }
        .btn-out:hover { background: #fecaca; }
        .act-cell { display: flex; gap: 6px; }

        /* ── 空状态 ── */
        .empty-row td { text-align: center; padding: 48px; color: #94a3b8; font-size: 14px; }

        /* ── 加载遮罩 ── */
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,.6);
                           z-index: 100; align-items: center; justify-content: center; }
        .loading-overlay.show { display: flex; }
        .spinner { width: 36px; height: 36px; border: 4px solid #e2e8f0;
                   border-top-color: #6366f1; border-radius: 50%; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── 弹窗 ── */
        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.45);
                          z-index: 200; align-items: center; justify-content: center; }
        .modal-backdrop.show { display: flex; }
        .modal { background: white; border-radius: 16px; padding: 28px 28px 24px;
                 width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
        .modal-title { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
        .modal-sub { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
        .modal-field label { font-size: 12px; font-weight: 700; color: #475569; display: block; margin-bottom: 6px; }
        .modal-field input { width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0;
                             border-radius: 8px; font-size: 15px; font-weight: 700; color: #0f172a; }
        .modal-field input:focus { outline: none; border-color: #6366f1; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-confirm { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 14px;
                       font-weight: 700; cursor: pointer; color: white; }
        .btn-confirm.in-mode  { background: #16a34a; }
        .btn-confirm.out-mode { background: #dc2626; }
        .btn-cancel { padding: 10px 18px; border-radius: 8px; border: 1.5px solid #e2e8f0;
                      font-size: 14px; font-weight: 700; cursor: pointer; background: white; color: #64748b; }
        .modal-err { font-size: 12px; color: #dc2626; margin-top: 8px; min-height: 16px; }

        /* ── Toast ── */
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
                 background: #0f172a; color: white; padding: 10px 20px; border-radius: 10px;
                 font-size: 13px; font-weight: 600; z-index: 999; transition: transform .25s ease; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.ok  { background: #15803d; }
        .toast.err { background: #dc2626; }
    </style>
</head>
<body>
{% include "common/_admin_nav.html" %}

<div class="page-body">
    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <div class="page-title">库存管理</div>

        <!-- Tab 切换 -->
        <div class="tabs">
            <button class="tab-btn active" id="tabFinished" onclick="switchTab('finished')">成品库</button>
            <button class="tab-btn"        id="tabRemnant"  onclick="switchTab('remnant')">尾数库</button>
        </div>

        <!-- 客户过滤 -->
        <div class="filter-bar">
            <span class="filter-label">客户</span>
            <select class="cust-select" id="custFilter" onchange="loadData()">
                <option value="">全部客户</option>
                {% for c in customers %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- 关键字搜索 -->
        <input class="search-box" id="searchBox" type="text" placeholder="搜索件号 / 件名…" oninput="filterTable()">
    </div>

    <!-- 统计条 -->
    <div class="stat-bar" id="statBar">
        <div class="stat-chip"><div class="val" id="statTotal">—</div><div class="lbl">总结存（件）</div></div>
        <div class="stat-chip"><div class="val" id="statRows">—</div><div class="lbl">SKU 数</div></div>
        <div class="stat-chip"><div class="val" id="statZero">—</div><div class="lbl">零库存 SKU</div></div>
    </div>

    <!-- 数据表格 -->
    <div class="card">
        <table id="invTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- 加载遮罩 -->
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<!-- 出入库弹窗 -->
<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
        <div class="modal-title" id="modalTitle">入库登记</div>
        <div class="modal-sub"  id="modalSub"></div>
        <div class="modal-field">
            <label id="modalQtyLabel">变动数量</label>
            <input type="number" id="modalQty" min="1" placeholder="请输入数量">
        </div>
        <div class="modal-err" id="modalErr"></div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn-confirm" id="modalConfirm" onclick="submitAdjust()">确认</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/static/js/api_config.js"></script>
<script>
'use strict';

var _tab      = 'finished';   // 当前 tab
var _rows     = [];           // 当前全量数据
var _modal    = {};           // 弹窗上下文

// ── Tab 切换 ─────────────────────────────────────────────────────────────────
function switchTab(tab) {
    _tab = tab;
    document.getElementById('tabFinished').classList.toggle('active', tab === 'finished');
    document.getElementById('tabRemnant').classList.toggle('active',  tab === 'remnant');
    loadData();
}

// ── 数据加载 ─────────────────────────────────────────────────────────────────
function loadData() {
    var customer = document.getElementById('custFilter').value;
    var module   = _tab === 'finished' ? 'sales.inventory_finished_list' : 'sales.inventory_remnant_list';

    showLoading(true);
    sendApiRequest(module, null, {
        queryParams: customer ? { customer: customer } : {}
    })
    .then(function(d) {
        showLoading(false);
        if (d.code !== 200) { showToast(d.message || '加载失败', 'err'); return; }
        _rows = d.data || [];
        renderTable(_rows);
        renderStats(_rows);
    })
    .catch(function(e) {
        showLoading(false);
        showToast('网络错误：' + e.message, 'err');
    });
}

// ── 表格渲染 ─────────────────────────────────────────────────────────────────
function renderTable(rows) {
    var isFinished = _tab === 'finished';
    var head = document.getElementById('tableHead');
    var body = document.getElementById('tableBody');

    // 表头
    var cols = isFinished
        ? ['库位', '客户', '客户件号', '件名 & 内部件号', '结存', '操作']
        : ['客户', '客户件号', '件名 & 内部件号', '结存', '操作'];
    head.innerHTML = '<tr>' + cols.map(function(c) {
        return '<th>' + c + '</th>';
    }).join('') + '</tr>';

    // 表体
    if (!rows.length) {
        var colspan = cols.length;
        body.innerHTML = '<tr class="empty-row"><td colspan="' + colspan + '">暂无库存数据</td></tr>';
        return;
    }

    body.innerHTML = rows.map(function(r) {
        var qtyClass = r.quantity > 0 ? 'qty-cell' : 'qty-cell qty-zero';
        var custName = r.customer_name || '<span style="color:#cbd5e1">—</span>';
        var custNo   = r.customer_part_no
            ? '<div class="cust-no">' + esc(r.customer_part_no) + '</div>'
            : '<span style="color:#cbd5e1">—</span>';
        var partCell = '<div class="part-no">' + esc(r.internal_name || '') + '</div>'
                     + '<div class="part-name">' + esc(r.part_number || '') + '</div>';

        var locCell = isFinished
            ? '<td><span class="location-badge">' + esc(r.location || '默认') + '</span></td>'
            : '';

        return '<tr data-search="' + esc((r.part_number||'') + ' ' + (r.internal_name||'') + ' ' + (r.customer_part_no||'') + ' ' + (r.customer_name||'')).toLowerCase() + '">'
            + locCell
            + '<td class="cust-name-cell">' + custName + '</td>'
            + '<td>' + custNo + '</td>'
            + '<td>' + partCell + '</td>'
            + '<td><span class="' + qtyClass + '">' + r.quantity + '</span></td>'
            + '<td><div class="act-cell">'
            +   '<button class="btn-in"  onclick="openModal(' + r.part_id + ',' + JSON.stringify(r.location||'') + ',1,this)">➕ 入库</button>'
            +   '<button class="btn-out" onclick="openModal(' + r.part_id + ',' + JSON.stringify(r.location||'') + ',-1,this)">➖ 出库</button>'
            + '</div></td>'
            + '</tr>';
    }).join('');
}

// ── 统计条 ───────────────────────────────────────────────────────────────────
function renderStats(rows) {
    var total = rows.reduce(function(s, r) { return s + (r.quantity || 0); }, 0);
    var zero  = rows.filter(function(r) { return !r.quantity; }).length;
    document.getElementById('statTotal').textContent = total.toLocaleString();
    document.getElementById('statRows').textContent  = rows.length;
    document.getElementById('statZero').textContent  = zero;
}

// ── 关键字过滤（纯前端，不重新请求）────────────────────────────────────────
function filterTable() {
    var kw = document.getElementById('searchBox').value.trim().toLowerCase();
    var trs = document.querySelectorAll('#tableBody tr[data-search]');
    trs.forEach(function(tr) {
        tr.style.display = (!kw || tr.dataset.search.indexOf(kw) !== -1) ? '' : 'none';
    });
}

// ── 弹窗 ─────────────────────────────────────────────────────────────────────
function openModal(partId, location, direction, btn) {
    _modal = { partId: partId, location: location, direction: direction };

    var isIn = direction > 0;
    var row  = btn.closest('tr');
    var partName = row.querySelector('.part-no')  ? row.querySelector('.part-no').textContent  : '';
    var partNo   = row.querySelector('.part-name') ? row.querySelector('.part-name').textContent : '';

    document.getElementById('modalTitle').textContent   = isIn ? '➕ 入库登记' : '➖ 出库登记';
    document.getElementById('modalSub').textContent     = partName + (partNo ? '  ' + partNo : '');
    document.getElementById('modalQtyLabel').textContent = isIn ? '入库数量' : '出库数量';
    document.getElementById('modalQty').value           = '';
    document.getElementById('modalErr').textContent     = '';

    var btn2 = document.getElementById('modalConfirm');
    btn2.className = 'btn-confirm ' + (isIn ? 'in-mode' : 'out-mode');
    btn2.textContent = isIn ? '确认入库' : '确认出库';

    document.getElementById('modalBackdrop').classList.add('show');
    setTimeout(function() { document.getElementById('modalQty').focus(); }, 80);
}

function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('show');
}

function submitAdjust() {
    var qty = parseInt(document.getElementById('modalQty').value, 10);
    if (!qty || qty < 1) {
        document.getElementById('modalErr').textContent = '请输入有效的正整数';
        return;
    }
    document.getElementById('modalErr').textContent = '';

    var delta   = _modal.direction * qty;
    var isFinished = _tab === 'finished';
    var module  = isFinished ? 'sales.inventory_finished_adjust' : 'sales.inventory_remnant_adjust';
    var payload = { delta: delta, location: _modal.location };

    document.getElementById('modalConfirm').disabled = true;
    sendApiRequest(module, payload, { pathParams: { partId: _modal.partId } })
    .then(function(d) {
        document.getElementById('modalConfirm').disabled = false;
        if (d.code !== 200) {
            document.getElementById('modalErr').textContent = d.message || '操作失败';
            return;
        }
        closeModal();
        showToast((_modal.direction > 0 ? '入库' : '出库') + '成功，当前结存：' + d.data.quantity, 'ok');
        loadData();
    })
    .catch(function(e) {
        document.getElementById('modalConfirm').disabled = false;
        document.getElementById('modalErr').textContent = '网络错误：' + e.message;
    });
}

// ── 工具函数 ─────────────────────────────────────────────────────────────────
function showLoading(on) {
    document.getElementById('loadingOverlay').classList.toggle('show', on);
}

function showToast(msg, type) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast ' + (type || '');
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, 2800);
}

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 初始加载
loadData();
</script>
</body>
</html>
