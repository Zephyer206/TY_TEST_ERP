<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>零件表 - 云冲压 ERP</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        :root {
            --blue: #1d4ed8; --blue-dark: #1e40af; --blue-light: #dbeafe;
            --green: #16a34a; --green-light: #dcfce7;
            --amber: #d97706; --amber-light: #fef3c7;
            --red: #dc2626; --red-light: #fef2f2;
            --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
            --gray-400: #9ca3af; --gray-600: #4b5563;
            --gray-800: #1f2937; --gray-900: #111827;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; min-height: 100vh; color: var(--gray-900); }

        .topbar {
            background: var(--blue-dark); color: white;
            padding: 0 16px; height: 52px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        .topbar-title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
        .topbar-count { font-size: 11px; opacity: 0.8; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px; }

        .content { padding: 12px 12px 80px; max-width: 960px; margin: 0 auto; }

        /* 搜索栏 */
        .search-bar {
            background: white; border-radius: 12px; padding: 10px 14px;
            margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            display: flex; align-items: center; gap: 10px;
        }
        .search-bar input {
            flex: 1; border: none; outline: none; font-size: 14px;
            color: var(--gray-900); background: transparent;
        }
        .search-bar input::placeholder { color: var(--gray-400); }
        .search-icon { font-size: 16px; color: var(--gray-400); flex-shrink: 0; }

        /* 统计行 */
        .stat-bar {
            display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px;
        }
        .stat-chip {
            flex-shrink: 0; padding: 5px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
        }
        .stat-chip-blue { background: var(--blue-light); color: var(--blue-dark); }
        .stat-chip-green { background: var(--green-light); color: var(--green); }
        .stat-chip-amber { background: var(--amber-light); color: var(--amber); }

        /* 卡片 */
        .part-card {
            background: white; border-radius: 14px; padding: 14px 16px;
            margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .part-card-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 10px;
        }
        .part-num { font-size: 15px; font-weight: 800; color: var(--gray-900); }
        .part-name { font-size: 12px; color: var(--gray-600); margin-top: 2px; }
        .part-material {
            display: inline-block; font-size: 11px; font-weight: 600;
            background: var(--amber-light); color: var(--amber);
            padding: 2px 8px; border-radius: 6px; margin-top: 4px;
        }

        /* 参数网格 */
        .param-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px;
        }
        .param-cell {
            background: var(--gray-50); border-radius: 9px; padding: 8px 10px; text-align: center;
        }
        .param-lbl { font-size: 10px; color: var(--gray-400); margin-bottom: 3px; }
        .param-val { font-size: 15px; font-weight: 800; color: var(--gray-900); }
        .param-val.has-val { color: var(--blue-dark); }

        /* 底部标签行 */
        .tag-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .tag { display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; }
        .tag-surface { background: var(--blue-light); color: var(--blue-dark); }
        .tag-mold { background: var(--green-light); color: var(--green); }
        .tag-drawing { background: var(--gray-100); color: var(--gray-600); }
        .tag-empty { background: var(--gray-100); color: var(--gray-400); }

        /* 空状态 */
        .empty-box {
            background: white; border-radius: 14px; padding: 48px 24px; text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .empty-icon { font-size: 40px; margin-bottom: 8px; }
        .empty-title { font-size: 14px; font-weight: 700; color: var(--gray-600); }
        .empty-sub { font-size: 12px; color: var(--gray-400); margin-top: 4px; }

        /* 隐藏行 */
        .hidden { display: none !important; }

        /* 平板/桌面端表格模式 */
        @media (min-width: 640px) {
            .part-list { display: none; }
            .part-table { display: block; background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
            .part-table table { width: 100%; border-collapse: collapse; }
            .part-table th, .part-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--gray-100); font-size: 13px; }
            .part-table th { background: var(--gray-50); color: var(--gray-600); font-size: 11px; font-weight: 600; letter-spacing: 0.3px; }
            .part-table td { color: var(--gray-800); }
            .part-table tr:hover td { background: #f8fafc; }
            .part-table .pn { font-weight: 700; color: var(--gray-900); }
            .part-table .num { font-weight: 800; color: var(--blue-dark); font-size: 14px; }
        }
        @media (max-width: 639px) {
            .part-table { display: none; }
        }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<div class="topbar">
    <div style="display:flex; align-items:center; gap:10px;">
        <a href="/" style="color:white; text-decoration:none; font-size:18px;">&#8592;</a>
        <span class="topbar-title">零件表</span>
        <span class="topbar-count" id="visible-count"></span>
    </div>
</div>

<div class="content">
    <!-- 搜索栏 -->
    <div class="search-bar">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="search-input" placeholder="搜索件号、名称、模具号..." autocomplete="off">
    </div>

    <!-- 统计行 -->
    <div class="stat-bar">
        <span class="stat-chip stat-chip-blue" id="stat-total"></span>
        <span class="stat-chip stat-chip-green" id="stat-with-mold"></span>
        <span class="stat-chip stat-chip-amber" id="stat-no-mold"></span>
    </div>

    <!-- 卡片列表（移动端） -->
    <div class="part-list" id="part-list"></div>

    <!-- 表格（桌面端） -->
    <div class="part-table">
        <table>
            <thead>
                <tr>
                    <th>件号</th>
                    <th>名称</th>
                    <th>原料</th>
                    <th>T (mm)</th>
                    <th>W (mm)</th>
                    <th>P (mm)</th>
                    <th>表面处理</th>
                    <th>模具号</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <!-- 空状态 -->
    <div class="empty-box hidden" id="empty-box">
        <div class="empty-icon">&#128269;</div>
        <div class="empty-title">未找到匹配的零件</div>
        <div class="empty-sub">请尝试其他关键字</div>
    </div>
</div>

<script>
(function() {
    const parts = {{ parts | tojson | safe }};
    const total = parts.length;
    const withMold = parts.filter(p => p.mold_numbers).length;
    const noMold = total - withMold;

    document.getElementById('stat-total').textContent = '共 ' + total + ' 个零件';
    document.getElementById('stat-with-mold').textContent = withMold + ' 个已关联模具';
    document.getElementById('stat-no-mold').textContent = noMold + ' 个未关联模具';

    function fmt(val, unit) {
        if (val === null || val === undefined || val === '' || val === 0) return '—';
        return val + (unit || '');
    }

    function makeCard(p) {
        return '<div class="part-card" data-search="' +
            (p.part_number || '') + ' ' + (p.internal_name || '') + ' ' + (p.mold_numbers || '') + ' ' + (p.material_name || '') +
            '">\
            <div class="part-card-header">\
                <div>\
                    <div class="part-num">' + (p.part_number || '—') + '</div>\
                    <div class="part-name">' + (p.internal_name || '—') + '</div>\
                    <div class="part-material">' + (p.material_name || '—') + '</div>\
                </div>\
            </div>\
            <div class="param-grid">\
                <div class="param-cell"><div class="param-lbl">T (mm)</div><div class="param-val ' + (p.thickness ? 'has-val' : '') + '">' + fmt(p.thickness) + '</div></div>\
                <div class="param-cell"><div class="param-lbl">W (mm)</div><div class="param-val ' + (p.width ? 'has-val' : '') + '">' + fmt(p.width) + '</div></div>\
                <div class="param-cell"><div class="param-lbl">P (mm)</div><div class="param-val ' + (p.press_stroke ? 'has-val' : '') + '">' + fmt(p.press_stroke) + '</div></div>\
            </div>\
            <div class="tag-row">\
                <span class="tag ' + (p.surface_txt ? 'tag-surface' : 'tag-empty') + '">&#9881; ' + (p.surface_txt || '无') + '</span>\
                <span class="tag ' + (p.mold_numbers ? 'tag-mold' : 'tag-empty') + '">&#128295; ' + (p.mold_numbers || '无模具') + '</span>\
                <span class="tag tag-empty">&#128196; ' + (p.drawing ? p.drawing : '无图纸') + '</span>\
            </div>\
        </div>';
    }

    function makeTableRow(p) {
        return '<tr>\
            <td class="pn">' + (p.part_number || '—') + '</td>\
            <td>' + (p.internal_name || '—') + '</td>\
            <td>' + (p.material_name || '—') + '</td>\
            <td>' + fmt(p.thickness) + '</td>\
            <td>' + fmt(p.width) + '</td>\
            <td>' + fmt(p.press_stroke) + '</td>\
            <td>' + (p.surface_txt || '—') + '</td>\
            <td>' + (p.mold_numbers || '—') + '</td>\
        </tr>';
    }

    function render(filter) {
        const list = document.getElementById('part-list');
        const tbody = document.getElementById('table-body');
        const empty = document.getElementById('empty-box');
        const count = document.getElementById('visible-count');
        filter = filter.toLowerCase().trim();

        const filtered = filter
            ? parts.filter(p =>
                (p.part_number  || '').toLowerCase().includes(filter) ||
                (p.internal_name || '').toLowerCase().includes(filter) ||
                (p.mold_numbers  || '').toLowerCase().includes(filter) ||
                (p.material_name || '').toLowerCase().includes(filter)
              )
            : parts;

        count.textContent = filtered.length + '/' + total;

        if (filtered.length === 0) {
            list.innerHTML = '';
            tbody.innerHTML = '';
            empty.classList.remove('hidden');
        } else {
            empty.classList.add('hidden');
            list.innerHTML = filtered.map(makeCard).join('');
            tbody.innerHTML = filtered.map(makeTableRow).join('');
        }
    }

    render('');

    document.getElementById('search-input').addEventListener('input', function() {
        render(this.value);
    });
})();
</script>

</body>
</html>
