<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>待检入库 - TY_ERP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f9ff; min-height: 100vh; }
        {% include "common/_admin_nav.html" %}
        .page-body { max-width: 600px; margin: 0 auto; padding: 20px 16px 80px; }
        .greet-card { background: linear-gradient(135deg, #0369a1, #0c4a6e); color: white; border-radius: 16px; padding: 20px 24px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(3,105,161,0.25); }
        .greet-title { font-size: 22px; font-weight: 800; }
        .greet-sub { font-size: 13px; opacity: 0.7; margin-top: 4px; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 5px solid #3b82f6; }
        .card-title { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 14px; }
        .form-field { margin-bottom: 16px; }
        .form-label { font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; color: #0f172a; background: white; outline: none; transition: border-color 0.15s; }
        .form-input:focus { border-color: #3b82f6; }
        .submit-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 17px; font-weight: 800; cursor: pointer; color: white; background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 6px 24px rgba(59,130,246,0.35); transition: transform 0.15s; }
        .submit-btn:active { transform: scale(0.97); }
        .success-overlay { display: none; position: fixed; inset: 0; background: rgba(34,197,94,0.92); z-index: 200; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .success-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
        .success-icon { font-size: 80px; margin-bottom: 16px; }
        .success-text { font-size: 28px; font-weight: 900; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .msg-error { background: #fef2f2; border: 2px solid #fca5a5; border-radius: 10px; padding: 10px 14px; color: #dc2626; font-size: 14px; margin-top: 10px; display: none; }
        .wip-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .wip-table th { text-align: left; padding: 8px 10px; background: #f1f5f9; color: #475569; border-bottom: 2px solid #e2e8f0; }
        .wip-table td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; }
        .wip-table tr:hover td { background: #f8fafc; }
        .stat-chip { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .chip-run { background: #dcfce7; color: #15803d; }
        .chip-pend { background: #fef9c3; color: #92400e; }
        .chip-comp { background: #e0f2fe; color: #0369a1; }
        .wip-badge { background: #f0fdf4; color: #15803d; font-weight: 700; }
    </style>
</head>
<body>
{% include "common/_admin_nav.html" %}
<div class="page-body">
    <div class="greet-card">
        <div class="greet-title">全检入库</div>
        <div class="greet-sub">{{ user.dept }} | {{ user.username }}</div>
    </div>

    <div class="card">
        <div class="card-title">入库操作</div>
        <div class="form-field">
            <label class="form-label">工单 ID *</label>
            <input class="form-input" type="number" id="wo_id" placeholder="输入工单 ID" min="1">
        </div>
        <div class="form-field">
            <label class="form-label">合格入库件数（valid_qty）*</label>
            <input class="form-input" type="number" id="valid_qty" placeholder="本次全检合格件数" min="1">
        </div>
        <div class="form-field">
            <label class="form-label">不良件数（reject_qty，可选）</label>
            <input class="form-input" type="number" id="reject_qty" placeholder="全检不合格件数，默认为 0" min="0" value="0">
        </div>
        <button class="submit-btn" onclick="submitStockIn()">确认入库</button>
        <div class="msg-error" id="error_msg"></div>
    </div>

    <div class="card">
        <div class="card-title">待检库存列表（wip_pcs &gt; 0）</div>
        <div id="wip_loader">加载中...</div>
    </div>

    <div class="card">
        <div class="card-title">不良品记录（最近 20 条）</div>
        <div id="defect_loader">加载中...</div>
    </div>
</div>

<div class="success-overlay" id="success_overlay" onclick="hideSuccess()">
    <div class="success-icon">&#10003;</div>
    <div class="success-text">入库成功</div>
</div>

<script src="/static/js/api_config.js"></script>
<script>
async function submitStockIn() {
    var woId = parseInt(document.getElementById('wo_id').value);
    var validQty = parseInt(document.getElementById('valid_qty').value);
    var rejectQty = parseInt(document.getElementById('reject_qty').value) || 0;
    if (!woId) { showError('请输入工单 ID'); return; }
    if (!validQty || validQty <= 0) { showError('合格入库件数必须 > 0'); return; }
    document.getElementById('error_msg').style.display = 'none';
    try {
        var res = await apiPost('pkg.wip_stock_in', {
            work_order_id: woId,
            valid_qty: validQty,
            reject_qty: rejectQty
        });
        if (res.code === 0) {
            document.getElementById('success_overlay').classList.add('show');
            loadWip();
        } else {
            showError(res.message || '入库失败');
        }
    } catch(e) { showError('网络错误: ' + e.message); }
}
function showError(msg) {
    var el = document.getElementById('error_msg');
    el.textContent = msg;
    el.style.display = 'block';
}
function hideSuccess() { document.getElementById('success_overlay').classList.remove('show'); }

async function loadWip() {
    var el = document.getElementById('wip_loader');
    try {
        var res = await apiGet('pkg.wip_overview');
        if (res.code === 0 && Array.isArray(res.data) && res.data.length > 0) {
            var html = '<table class="wip-table"><tr><th>工单号</th><th>件号</th><th>待检</th><th>状态</th></tr>';
            res.data.forEach(function(row) {
                var chipClass = row.order_status === 'RUNNING' ? 'chip-run'
                    : row.order_status === 'COMPLETED' ? 'chip-comp' : 'chip-pend';
                html += '<tr><td>#' + row.work_order_id + '<br><small style="color:#64748b">' + (row.order_no || '') + '</small></td>'
                    + '<td>' + row.part_number + '</td>'
                    + '<td><span class="stat-chip wip-badge">' + row.wip_pcs + '</span></td>'
                    + '<td><span class="stat-chip ' + chipClass + '">' + row.order_status + '</span></td></tr>';
            });
            html += '</table>';
            el.innerHTML = html;
        } else {
            el.innerHTML = '<div style="color:#9ca3af;font-size:14px;">暂无待检数据</div>';
        }
    } catch(e) { el.innerHTML = '<div style="color:#ef4444;">加载失败: ' + e.message + '</div>'; }
}

async function loadDefects() {
    var el = document.getElementById('defect_loader');
    try {
        var res = await apiGet('pkg.defect_logs');
        if (res.code === 0 && Array.isArray(res.data) && res.data.length > 0) {
            var html = '<table class="wip-table"><tr><th>时间</th><th>工单</th><th>不良数</th><th>原因</th></tr>';
            res.data.slice(0, 20).forEach(function(row) {
                html += '<tr><td>' + new Date(row.created_at).toLocaleDateString('zh-CN') + '</td>'
                    + '<td>#' + row.work_order_id + '</td>'
                    + '<td style="color:#dc2626;font-weight:700;">' + row.defect_qty + '</td>'
                    + '<td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;">' + (row.reason || '') + '</td></tr>';
            });
            html += '</table>';
            el.innerHTML = html;
        } else {
            el.innerHTML = '<div style="color:#9ca3af;font-size:14px;">暂无不良品记录</div>';
        }
    } catch(e) { el.innerHTML = '<div style="color:#ef4444;">加载失败: ' + e.message + '</div>'; }
}
loadWip();
loadDefects();
</script>
</body>
</html>
